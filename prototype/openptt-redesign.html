<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenPTT · Reading desk redesign</title>
  <style>
    :root {
      --canvas: #f4f1eb;
      --surface: #fffdfa;
      --surface-2: #f0ece5;
      --surface-3: #e9e4dc;
      --ink: #273231;
      --ink-strong: #162322;
      --muted: #78817d;
      --line: #ddd9d0;
      --brand: #277b6e;
      --brand-strong: #166356;
      --brand-soft: #e0f0eb;
      --hot: #d76542;
      --hot-soft: #f9e5dc;
      --boo: #a84c63;
      --boo-soft: #f5e2e7;
      --pin: #b78029;
      --shadow: 0 20px 55px rgba(38, 43, 39, .08);
      --shadow-soft: 0 8px 26px rgba(38, 43, 39, .055);
      --radius-lg: 22px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }
    [data-theme="dark"] {
      --canvas: #151a19;
      --surface: #1c2422;
      --surface-2: #222c29;
      --surface-3: #293532;
      --ink: #d6dfdb;
      --ink-strong: #f4faf7;
      --muted: #8d9a95;
      --line: #34413d;
      --brand: #69c1ab;
      --brand-strong: #8bd8c3;
      --brand-soft: #213b35;
      --hot: #ff9b76;
      --hot-soft: #3c2924;
      --boo: #f291a4;
      --boo-soft: #3c282e;
      --pin: #f0c45d;
      --shadow: 0 20px 55px rgba(0, 0, 0, .22);
      --shadow-soft: 0 8px 26px rgba(0, 0, 0, .16);
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; scroll-behavior: smooth; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font: 14px/1.55 "Noto Sans TC", "PingFang TC", system-ui, sans-serif; }
    button, input { font: inherit; }
    button { color: inherit; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 65%, white); outline-offset: 3px; }
    .app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { position: sticky; top: 0; display: flex; flex-direction: column; height: 100vh; padding: 25px 15px 18px; background: var(--surface); border-right: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 11px 28px; }
    .brand-mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 13px; color: #fff; background: var(--brand-strong); font-weight: 900; letter-spacing: -.08em; box-shadow: 0 8px 18px color-mix(in srgb, var(--brand) 24%, transparent); }
    .brand-name { color: var(--ink-strong); font-size: 17px; font-weight: 850; letter-spacing: -.04em; }
    .brand-note { color: var(--muted); font-size: 10px; letter-spacing: .04em; }
    .nav-group { margin-bottom: 24px; }
    .nav-label { padding: 0 12px 8px; color: var(--muted); font-size: 10px; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }
    .nav { display: grid; gap: 3px; }
    .nav-button { display: flex; align-items: center; gap: 11px; width: 100%; padding: 10px 12px; border: 0; border-radius: 11px; background: transparent; color: var(--muted); text-align: left; font-weight: 700; }
    .nav-button:hover { background: var(--surface-2); color: var(--ink-strong); }
    .nav-button.active { background: var(--brand-soft); color: var(--brand-strong); }
    .nav-icon { display: grid; place-items: center; width: 19px; color: currentColor; font-size: 16px; }
    .nav-count { margin-left: auto; padding: 2px 6px; border-radius: 999px; background: var(--hot-soft); color: var(--hot); font-size: 10px; font-weight: 850; }
    .sidebar-bottom { margin-top: auto; padding: 15px 11px 0; border-top: 1px solid var(--line); }
    .source-mini { display: flex; align-items: flex-start; gap: 9px; color: var(--muted); font-size: 11px; }
    .source-dot { width: 7px; height: 7px; margin-top: 5px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
    .source-mini strong { display: block; margin-bottom: 2px; color: var(--ink); font-size: 11px; }
    .main { min-width: 0; }
    .topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; min-height: 76px; padding: 15px 34px; background: color-mix(in srgb, var(--canvas) 88%, transparent); border-bottom: 1px solid var(--line); backdrop-filter: blur(18px); }
    .mobile-menu { display: none; }
    .context { flex: 0 0 auto; color: var(--muted); font-size: 12px; }
    .context strong { display: block; color: var(--ink-strong); font-size: 13px; }
    .search { position: relative; flex: 1; max-width: 570px; margin: 0 auto; }
    .search::before { content: "⌕"; position: absolute; left: 15px; top: 8px; color: var(--muted); font-size: 21px; }
    .search input { width: 100%; height: 44px; padding: 0 74px 0 42px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); color: var(--ink-strong); box-shadow: var(--shadow-soft); }
    .search input::placeholder { color: var(--muted); }
    .search kbd { position: absolute; top: 11px; right: 11px; padding: 2px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); color: var(--muted); font-size: 10px; }
    .top-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
    .icon-button, .theme-button { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); color: var(--ink); }
    .icon-button:hover, .theme-button:hover { border-color: var(--brand); color: var(--brand-strong); }
    .guest { display: flex; align-items: center; gap: 7px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: var(--surface); font-size: 11px; }
    .guest .source-dot { width: 6px; height: 6px; margin: 0; box-shadow: none; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 288px; gap: 30px; width: min(1410px, 100%); margin: 0 auto; padding: 38px 34px 90px; }
    .content { min-width: 0; }
    .eyebrow { color: var(--brand-strong); font-size: 10px; font-weight: 900; letter-spacing: .14em; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 8px; color: var(--ink-strong); font-size: clamp(29px, 3.3vw, 45px); line-height: 1.12; letter-spacing: -.065em; }
    h2 { margin-bottom: 0; color: var(--ink-strong); font-size: 20px; line-height: 1.25; letter-spacing: -.04em; }
    h3 { color: var(--ink-strong); font-size: 14px; }
    .lede { max-width: 590px; margin-bottom: 0; color: var(--muted); }
    .hero { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 22px; align-items: stretch; margin-bottom: 29px; }
    .hero-copy { padding: 8px 0; }
    .hero-copy h1 { max-width: 620px; }
    .hero-copy .lede { max-width: 520px; font-size: 15px; }
    .hero-metric { padding: 21px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-soft); }
    .hero-metric-label { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 11px; }
    .hero-metric-value { margin: 12px 0 5px; color: var(--ink-strong); font-size: 31px; font-weight: 850; letter-spacing: -.06em; }
    .hero-metric-note { color: var(--brand-strong); font-size: 11px; font-weight: 750; }
    .hero-metric-bar { height: 8px; margin-top: 18px; overflow: hidden; border-radius: 999px; background: var(--surface-3); }
    .hero-metric-bar span { display: block; width: 72%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--brand), #89c88d); }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 14px; margin: 28px 0 13px; }
    .section-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .text-button { padding: 4px 0; border: 0; background: transparent; color: var(--brand-strong); font-size: 12px; font-weight: 800; }
    .text-button:hover { text-decoration: underline; }
    .card { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-soft); }
    .continue-card { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; padding: 19px 21px; }
    .continue-kicker { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; color: var(--muted); font-size: 11px; }
    .continue-kicker strong { color: var(--brand-strong); }
    .continue-title { display: block; margin-bottom: 6px; color: var(--ink-strong); font-size: 18px; font-weight: 820; letter-spacing: -.035em; }
    .continue-title:hover { color: var(--brand-strong); }
    .continue-meta { color: var(--muted); font-size: 11px; }
    .continue-progress { min-width: 132px; text-align: right; }
    .progress-label { display: flex; justify-content: space-between; margin-bottom: 7px; color: var(--muted); font-size: 10px; }
    .progress { height: 6px; overflow: hidden; border-radius: 99px; background: var(--surface-3); }
    .progress span { display: block; width: 42%; height: 100%; border-radius: inherit; background: var(--brand); }
    .feed-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 11px; }
    .tabs { display: flex; gap: 5px; padding: 4px; border-radius: 12px; background: var(--surface-2); }
    .tab { padding: 8px 13px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 800; }
    .tab:hover { color: var(--ink-strong); }
    .tab.active { background: var(--surface); color: var(--ink-strong); box-shadow: 0 2px 8px rgba(38, 43, 39, .06); }
    .filter-select { height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink); font-size: 11px; }
    .feed { overflow: hidden; }
    .article { position: relative; display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 14px; padding: 18px 20px; border-bottom: 1px solid var(--line); transition: background .15s; }
    .article:last-child { border-bottom: 0; }
    .article:hover { background: var(--surface-2); }
    .article.hot::before { content: ""; position: absolute; top: 18px; bottom: 18px; left: 0; width: 3px; border-radius: 0 4px 4px 0; background: var(--hot); }
    .board-avatar { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; background: var(--brand-soft); color: var(--brand-strong); font-size: 13px; font-weight: 900; }
    .article-main { min-width: 0; }
    .article-topline { display: flex; align-items: center; gap: 7px; min-width: 0; margin-bottom: 6px; color: var(--muted); font-size: 10px; }
    .board-label { color: var(--brand-strong); font-weight: 850; }
    .dot { color: var(--surface-3); }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: 999px; font-size: 9px; font-weight: 850; }
    .badge.hot { background: var(--hot-soft); color: var(--hot); }
    .badge.pin { background: color-mix(in srgb, var(--pin) 17%, var(--surface)); color: var(--pin); }
    .badge.match { background: var(--brand-soft); color: var(--brand-strong); }
    .article-title { display: block; overflow: hidden; color: var(--ink-strong); font-size: 15px; font-weight: 820; line-height: 1.42; text-overflow: ellipsis; white-space: nowrap; }
    .article-title, .continue-title, .queue-title { padding: 0; border: 0; background: transparent; text-align: left; }
    .article-title:hover { color: var(--brand-strong); }
    .article-snippet { display: -webkit-box; overflow: hidden; margin: 5px 0 8px; color: var(--muted); font-size: 12px; line-height: 1.6; -webkit-box-orient: vertical; -webkit-line-clamp: 1; }
    .article-meta { color: var(--muted); font-size: 10px; }
    .article-signal { display: grid; align-content: center; justify-items: end; gap: 8px; min-width: 92px; }
    .signal-numbers { display: flex; gap: 8px; color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .signal-numbers .push { color: var(--hot); }
    .signal-numbers .boo { color: var(--boo); }
    .signal-bar { width: 86px; height: 5px; overflow: hidden; border-radius: 99px; background: var(--surface-3); }
    .signal-bar span { display: block; width: 78%; height: 100%; border-radius: inherit; background: var(--hot); }
    .save { display: grid; place-items: center; width: 34px; height: 34px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 18px; }
    .save:hover, .save.saved { background: var(--hot-soft); color: var(--hot); }
    .board-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .board-pill { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 13px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
    .board-pill:hover { border-color: var(--brand); background: var(--surface-2); }
    .board-pill .board-avatar { width: 34px; height: 34px; border-radius: 11px; font-size: 11px; }
    .board-pill-main { min-width: 0; }
    .board-pill strong { display: block; overflow: hidden; color: var(--ink-strong); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .board-pill small { color: var(--muted); font-size: 10px; }
    .right-rail { min-width: 0; }
    .rail-card { padding: 18px; margin-bottom: 14px; }
    .rail-head { display: flex; align-items: center; justify-content: space-between; gap: 9px; margin-bottom: 15px; }
    .rail-head h2 { font-size: 15px; }
    .rail-head small { color: var(--muted); font-size: 10px; }
    .queue { display: grid; gap: 3px; }
    .queue-item { display: grid; grid-template-columns: 25px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .queue-item:last-child { border-bottom: 0; }
    .queue-num { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 7px; background: var(--surface-2); color: var(--muted); font: 11px ui-monospace, monospace; }
    .queue-title { display: -webkit-box; overflow: hidden; color: var(--ink-strong); font-size: 11px; font-weight: 750; line-height: 1.45; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .queue-meta { margin-top: 3px; color: var(--muted); font-size: 9px; }
    .queue-remove { border: 0; background: transparent; color: var(--muted); font-size: 13px; }
    .queue-remove:hover { color: var(--boo); }
    .status-card { background: var(--brand-soft); border-color: color-mix(in srgb, var(--brand) 25%, var(--line)); box-shadow: none; }
    .status-card h2 { margin-bottom: 7px; font-size: 15px; }
    .status-card p { margin-bottom: 0; color: var(--muted); font-size: 11px; }
    .status-line { display: flex; align-items: center; gap: 7px; margin-top: 13px; color: var(--brand-strong); font-size: 10px; font-weight: 800; }
    .empty { padding: 36px 18px; color: var(--muted); text-align: center; }
    .empty strong { display: block; margin-bottom: 5px; color: var(--ink-strong); }
    .mobile-bottom { display: none; }
    .reader-backdrop { position: fixed; inset: 0; z-index: 20; display: none; align-items: stretch; justify-content: flex-end; background: rgba(18, 28, 25, .34); }
    .reader-backdrop.open { display: flex; }
    .reader-panel { width: min(640px, 100%); height: 100%; overflow: auto; padding: 31px 34px 60px; background: var(--surface); box-shadow: -22px 0 70px rgba(0,0,0,.18); }
    .reader-top { display: flex; justify-content: space-between; gap: 15px; margin-bottom: 30px; }
    .reader-close { display: grid; place-items: center; width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-2); color: var(--muted); font-size: 19px; }
    .reader-panel h2 { margin: 9px 0 12px; font-size: clamp(26px, 4vw, 39px); line-height: 1.17; }
    .reader-meta { color: var(--muted); font-size: 11px; }
    .reader-summary { display: flex; gap: 20px; margin: 23px 0 27px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface-2); color: var(--muted); font: 11px ui-monospace, monospace; }
    .reader-summary .push { color: var(--hot); }
    .reader-body { color: var(--ink); font-size: 15px; line-height: 2; }
    .reader-body p { margin-bottom: 17px; }
    .reader-body blockquote { margin: 22px 0; padding: 12px 16px; border-left: 3px solid var(--brand); border-radius: 0 10px 10px 0; background: var(--surface-2); color: var(--muted); }
    .reader-footer { display: flex; justify-content: space-between; gap: 10px; margin-top: 35px; padding-top: 18px; border-top: 1px solid var(--line); }
    .primary, .secondary { min-height: 40px; padding: 0 14px; border-radius: 10px; font-weight: 800; }
    .primary { border: 1px solid var(--brand-strong); background: var(--brand-strong); color: #fff; }
    .secondary { border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
    .primary:hover, .secondary:hover { filter: brightness(1.04); border-color: var(--brand); }
    .toast { position: fixed; left: 50%; bottom: 28px; z-index: 30; transform: translate(-50%, 15px); padding: 11px 15px; border-radius: 11px; background: var(--ink-strong); color: var(--surface); box-shadow: var(--shadow); font-size: 12px; opacity: 0; pointer-events: none; transition: .2s; }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 1120px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      .right-rail { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      .right-rail .rail-card { margin-bottom: 0; }
      .right-rail .status-card { grid-column: 1 / -1; }
    }
    @media (max-width: 767px) {
      .app { display: block; }
      .sidebar { display: none; }
      .topbar { min-height: 64px; padding: 10px 14px; }
      .mobile-menu { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); font-size: 18px; }
      .context { display: none; }
      .search { margin: 0; }
      .search kbd { display: none; }
      .guest { display: none; }
      .layout { display: block; padding: 26px 16px 98px; }
      .hero { display: block; margin-bottom: 25px; }
      .hero-copy { padding: 0 0 19px; }
      h1 { font-size: 32px; }
      .hero-metric { display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 15px 17px; }
      .hero-metric-value { margin: 5px 0 0; font-size: 25px; }
      .hero-metric-bar { grid-column: 1 / -1; margin-top: 13px; }
      .continue-card { display: block; padding: 16px; }
      .continue-progress { margin-top: 16px; text-align: left; }
      .feed-toolbar { align-items: flex-start; flex-direction: column; }
      .tabs { width: 100%; overflow-x: auto; }
      .tab { flex: 1; white-space: nowrap; }
      .filter-select { width: 100%; }
      .article { grid-template-columns: 34px minmax(0, 1fr); gap: 10px; padding: 16px 14px; }
      .article-signal { grid-column: 2; display: flex; justify-content: space-between; align-items: center; width: 100%; }
      .article-title { white-space: normal; }
      .article-snippet { -webkit-line-clamp: 2; }
      .article.hot::before { top: 16px; bottom: 16px; }
      .board-avatar { width: 34px; height: 34px; border-radius: 11px; font-size: 11px; }
      .board-strip { grid-template-columns: 1fr; }
      .right-rail { display: block; margin-top: 26px; }
      .right-rail .rail-card { margin-bottom: 12px; }
      .mobile-bottom { position: fixed; right: 0; bottom: 0; left: 0; z-index: 8; display: grid; grid-template-columns: repeat(4, 1fr); padding: 8px 8px max(8px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(18px); }
      .mobile-bottom button { display: grid; gap: 2px; place-items: center; padding: 4px; border: 0; background: transparent; color: var(--muted); font-size: 10px; font-weight: 750; }
      .mobile-bottom button span { font-size: 18px; }
      .mobile-bottom button.active { color: var(--brand-strong); }
      .reader-panel { padding: 24px 18px 50px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="OpenPTT 導覽">
      <div class="brand"><div class="brand-mark">↗</div><div><div class="brand-name">OpenPTT</div><div class="brand-note">READING DESK</div></div></div>
      <div class="nav-group"><div class="nav-label">閱讀</div><nav class="nav">
        <button class="nav-button active" data-view="home"><span class="nav-icon">⌂</span>閱讀桌</button>
        <button class="nav-button" data-view="boards"><span class="nav-icon">▤</span>看板探索</button>
        <button class="nav-button" data-view="hot"><span class="nav-icon">ϟ</span>熱門訊號<span class="nav-count">12</span></button>
        <button class="nav-button" data-view="favorites"><span class="nav-icon">☆</span>我的收藏</button>
      </nav></div>
      <div class="nav-group"><div class="nav-label">整理</div><nav class="nav">
        <button class="nav-button" data-view="history"><span class="nav-icon">◷</span>閱讀歷史</button>
        <button class="nav-button" data-view="queue"><span class="nav-icon">▱</span>閱讀佇列</button>
      </nav></div>
      <div class="nav-group"><div class="nav-label">系統</div><nav class="nav">
        <button class="nav-button" data-view="settings"><span class="nav-icon">⚙</span>閱讀偏好</button>
        <button class="nav-button" data-view="about"><span class="nav-icon">ⓘ</span>關於與資料</button>
      </nav></div>
      <div class="sidebar-bottom"><div class="source-mini"><span class="source-dot"></span><div><strong>來源狀態正常</strong>PTT adapter · 最近同步 6 分鐘前</div></div></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" aria-label="開啟選單">☰</button>
        <div class="context"><strong id="context-title">閱讀桌</strong><span id="context-note">把今天想讀的內容放在一起</span></div>
        <label class="search"><span class="sr-only">搜尋看板、文章或作者</span><input id="search" type="search" placeholder="搜尋看板、文章或作者" /><kbd>/</kbd></label>
        <div class="top-actions"><span class="guest"><span class="source-dot"></span>訪客閱讀模式</span><button class="theme-button" id="theme" aria-label="切換主題">☾</button></div>
      </header>

      <div class="layout">
        <section class="content" id="content" aria-live="polite"></section>
        <aside class="right-rail" id="rail" aria-label="閱讀側欄"></aside>
      </div>
    </main>
  </div>

  <nav class="mobile-bottom" aria-label="主要導覽">
    <button data-view="home" class="active"><span>⌂</span>閱讀桌</button>
    <button data-view="boards"><span>▤</span>看板</button>
    <button data-view="hot"><span>ϟ</span>熱門</button>
    <button data-view="favorites"><span>☆</span>收藏</button>
  </nav>

  <div class="reader-backdrop" id="reader" role="dialog" aria-modal="true" aria-label="文章閱讀器"><article class="reader-panel"><div id="reader-content"></div></article></div>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const articles = [
      { id: 'a1', board: 'Tech_Job', avatar: 'TJ', title: '[心得] 今年轉職後，終於找到比較像生活的工作', snippet: '把面試、薪資與團隊文化整理成一篇，給正在猶豫的人參考。', author: 'softly', time: '18 分鐘前', push: 82, boo: 3, arrow: 17, hot: true, tag: '命中：轉職' },
      { id: 'a2', board: 'Stock', avatar: 'ST', title: '[新聞] 台股早盤震盪，電子權值股輪動加快', snippet: '盤面焦點落在半導體與金融，成交量較昨日同期放大。', author: 'marketwatch', time: '32 分鐘前', push: 54, boo: 8, arrow: 26, hot: true, tag: '' },
      { id: 'a3', board: 'Lifeismoney', avatar: 'LM', title: '[情報] 這週末超商咖啡第二杯優惠整理', snippet: '整理各家門市與限時活動，出門前可以先存起來。', author: 'save_more', time: '1 小時前', push: 41, boo: 1, arrow: 12, hot: false, tag: '' },
      { id: 'a4', board: 'NBA', avatar: 'NB', title: '[討論] 季後賽防守策略，這個調度真的看不懂', snippet: '從第四節的輪轉開始，整場節奏和前幾場很不一樣。', author: 'boxscore', time: '2 小時前', push: 38, boo: 4, arrow: 21, hot: false, tag: '' },
      { id: 'a5', board: 'Gossiping', avatar: 'GP', title: '[問卦] 大家最近下班後都在做什麼？', snippet: '想找一些不需要花很多錢、又可以真的放鬆的活動。', author: 'afterwork', time: '3 小時前', push: 27, boo: 12, arrow: 9, hot: false, tag: '' }
    ];
    const boards = [
      { name: 'Tech_Job', desc: '科技職涯與面試經驗', count: '12.4k 人關注', avatar: 'TJ' },
      { name: 'Stock', desc: '投資理財與市場觀察', count: '18.8k 人關注', avatar: 'ST' },
      { name: 'Lifeismoney', desc: '省錢情報與消費分享', count: '9.6k 人關注', avatar: 'LM' },
      { name: 'NBA', desc: '籃球賽事與球員討論', count: '7.2k 人關注', avatar: 'NB' },
      { name: 'Gossiping', desc: '綜合生活與時事討論', count: '24.1k 人關注', avatar: 'GP' },
      { name: 'Japan_Travel', desc: '日本旅遊規劃與經驗', count: '6.8k 人關注', avatar: 'JT' }
    ];
    let currentView = 'home';
    let feedMode = 'for-you';
    let boardFilter = '全部看板';
    let query = '';
    const saved = new Set(['a1', 'board-Tech_Job']);
    const queue = ['a1', 'a3', 'a4'];

    const $ = (selector) => document.querySelector(selector);
    const escapeHtml = (value) => value.replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
    const filteredArticles = () => articles.filter((article) => {
      const text = `${article.board} ${article.title} ${article.snippet} ${article.author}`.toLocaleLowerCase();
      return (!query || text.includes(query.toLocaleLowerCase())) && (boardFilter === '全部看板' || article.board === boardFilter);
    });
    const articleRow = (article) => `<article class="article ${article.hot ? 'hot' : ''}">
      <div class="board-avatar">${article.avatar}</div><div class="article-main">
        <div class="article-topline"><span class="board-label">${article.board}</span><span class="dot">·</span><span>${article.time}</span>${article.hot ? '<span class="badge hot">熱門</span>' : ''}${article.tag ? `<span class="badge match">${article.tag}</span>` : ''}</div>
        <button class="article-title" data-article="${article.id}">${article.title}</button>
        <p class="article-snippet">${article.snippet}</p><div class="article-meta">${article.author}　·　閱讀全文 →</div>
      </div><div class="article-signal"><div class="signal-numbers"><span class="push">推 ${article.push}</span><span class="boo">噓 ${article.boo}</span><span>↔ ${article.arrow}</span></div><div class="signal-bar"><span style="width:${Math.min(94, 35 + article.push / 1.7)}%"></span></div><button class="save ${saved.has(article.id) ? 'saved' : ''}" data-save="${article.id}" aria-label="${saved.has(article.id) ? '取消收藏' : '收藏'}">${saved.has(article.id) ? '★' : '☆'}</button></div>
    </article>`;
    const boardCard = (board) => `<button class="board-pill" data-board="${board.name}"><span class="board-avatar">${board.avatar}</span><span class="board-pill-main"><strong>${board.name}</strong><small>${board.count}</small></span><span style="margin-left:auto;color:var(--muted)">›</span></button>`;

    function renderHome() {
      const visible = filteredArticles();
      return `<div class="hero"><div class="hero-copy"><div class="eyebrow">YOUR READING DESK</div><h1>今天先讀什麼？</h1><p class="lede">把追蹤中的看板、熱門訊號和上次讀到的位置，整理成一個不用登入的閱讀工作台。</p></div><div class="hero-metric"><div><div class="hero-metric-label"><span>今日閱讀節奏</span><span>3 / 5</span></div><div class="hero-metric-value">還有 2 篇</div><div class="hero-metric-note">照自己的速度繼續</div></div><div class="hero-metric-bar"><span></span></div></div></div>
        <section><div class="section-head"><div><h2>繼續閱讀</h2><p>從上次離開的地方接著看</p></div><button class="text-button" data-view="history">查看歷史 →</button></div><div class="card continue-card"><div><div class="continue-kicker"><strong>Tech_Job</strong><span>·</span><span>上次閱讀 6 分鐘</span></div><button class="continue-title" data-article="a1">${articles[0].title}</button><div class="continue-meta">softly · 18 分鐘前 · 目前讀到第 4 段</div></div><div class="continue-progress"><div class="progress-label"><span>閱讀進度</span><strong>42%</strong></div><div class="progress"><span></span></div></div></div></section>
        <section><div class="section-head"><div><h2>閱讀訊號</h2><p>只留下值得停下來看的內容</p></div><button class="text-button" data-view="hot">看全部熱門 →</button></div><div class="feed-toolbar"><div class="tabs"><button class="tab ${feedMode === 'for-you' ? 'active' : ''}" data-feed="for-you">為你整理</button><button class="tab ${feedMode === 'latest' ? 'active' : ''}" data-feed="latest">最新</button><button class="tab ${feedMode === 'hot' ? 'active' : ''}" data-feed="hot">最熱</button></div><label><span class="sr-only">依看板篩選</span><select class="filter-select" id="board-filter"><option>全部看板</option>${boards.map((board) => `<option ${boardFilter === board.name ? 'selected' : ''}>${board.name}</option>`).join('')}</select></label></div><div class="card feed">${visible.length ? visible.map(articleRow).join('') : '<div class="empty"><strong>沒有符合的文章</strong>換一個關鍵字或清除看板篩選。</div>'}</div></section>
        <section><div class="section-head"><div><h2>追蹤中的看板</h2><p>快速回到你常讀的地方</p></div><button class="text-button" data-view="boards">探索 33 個看板 →</button></div><div class="board-strip">${boards.slice(0, 3).map(boardCard).join('')}</div></section>`;
    }
    function renderBoards() {
      const list = boards.filter((board) => !query || `${board.name} ${board.desc}`.toLocaleLowerCase().includes(query.toLocaleLowerCase()));
      return `<div class="hero-copy" style="margin-bottom:27px"><div class="eyebrow">BOARD EXPLORER</div><h1>找到下一個想讀的板</h1><p class="lede">用看板名稱或描述搜尋，先看清楚上下文，再決定要不要收藏。</p></div><div class="card feed">${list.length ? list.map((board) => `<button class="board-pill" style="border:0;border-bottom:1px solid var(--line);border-radius:0;padding:17px 20px;text-align:left" data-board="${board.name}"><span class="board-avatar">${board.avatar}</span><span class="board-pill-main"><strong>${board.name}</strong><small>${board.desc} · ${board.count}</small></span><span style="margin-left:auto;color:var(--muted)">開板　›</span></button>`).join('') : '<div class="empty"><strong>找不到相關看板</strong>試試輸入中文描述或英文板名。</div>'}</div>`;
    }
    function renderHot() { return `<div class="hero-copy" style="margin-bottom:27px"><div class="eyebrow">SIGNAL FEED</div><h1>熱門訊號</h1><p class="lede">依推噓與近期活躍度整理，適合快速掃一輪；不把熱度當成真理。</p></div><div class="card feed">${articles.slice().sort((a, b) => b.push - a.push).map(articleRow).join('')}</div>`; }
    function renderFavorites() { const favoriteArticles = articles.filter((article) => saved.has(article.id)); return `<div class="hero-copy" style="margin-bottom:27px"><div class="eyebrow">SAVED FOR LATER</div><h1>我的收藏</h1><p class="lede">看板與文章都只儲存在這個瀏覽器，不需要建立帳號。</p></div><div class="section-head"><div><h2>文章</h2><p>${favoriteArticles.length} 篇收藏</p></div></div><div class="card feed">${favoriteArticles.length ? favoriteArticles.map(articleRow).join('') : '<div class="empty"><strong>還沒有收藏文章</strong>在文章列按下 ☆，把想回來看的內容留在這裡。</div>'}</div>`; }
    function renderHistory() { return `<div class="hero-copy" style="margin-bottom:27px"><div class="eyebrow">READING HISTORY</div><h1>閱讀歷史</h1><p class="lede">保留最近看過的板與文章，讓回訪不用重新搜尋。</p></div><div class="card feed">${articles.slice(0, 4).map(articleRow).join('')}</div>`; }
    function renderQueue() { return `<div class="hero-copy" style="margin-bottom:27px"><div class="eyebrow">READING QUEUE</div><h1>閱讀佇列</h1><p class="lede">先存下來，等有時間再讀。佇列只存在本機。</p></div><div class="card rail-card">${queue.map((id, index) => { const article = articles.find((item) => item.id === id); return `<div class="queue-item"><span class="queue-num">${index + 1}</span><div><button class="queue-title" data-article="${article.id}">${article.title}</button><div class="queue-meta">${article.board} · ${article.time}</div></div><button class="queue-remove" data-remove-queue="${article.id}" aria-label="移除 ${article.title}">×</button></div>`; }).join('')}</div>`; }
    function renderSettings() { return `<div class="hero-copy" style="margin-bottom:27px"><div class="eyebrow">PREFERENCES</div><h1>閱讀偏好</h1><p class="lede">只調整閱讀體驗，不建立帳號、不儲存 PTT 密碼。</p></div><div class="card rail-card"><div class="rail-head"><h2>主題</h2><small>local only</small></div><div class="tabs"><button class="tab" data-theme-choice="light">淺色</button><button class="tab" data-theme-choice="dark">深色</button><button class="tab" data-theme-choice="system">系統</button></div><div class="rail-head" style="margin-top:26px"><h2>資料與隱私</h2></div><p style="color:var(--muted);font-size:12px">收藏、主題與閱讀歷史只留在這個瀏覽器。prototype 使用示範資料；正式資料會標示來源與更新時間。</p><button class="secondary" id="clear-saved">清除本機收藏</button></div>`; }
    function renderAbout() { return `<div class="hero-copy" style="margin-bottom:27px"><div class="eyebrow">ABOUT OPENPTT</div><h1>閱讀，不必先學會 PTT。</h1><p class="lede">OpenPTT 是 reading-first、guest-first 的跨平台 PTT 瀏覽器，保留推噓語彙，但移除終端機操作摩擦。</p></div><div class="card rail-card"><div class="rail-head"><h2>這版 prototype 展示</h2><small>v2.0 redesign</small></div><p style="color:var(--muted);font-size:12px">閱讀桌、熱門訊號、看板探索、收藏、歷史、閱讀佇列與主題切換。尚未包含登入、發文、回文、推噓、Web Push 或付費。</p></div><div class="card rail-card"><div class="rail-head"><h2>資料狀態</h2><small>透明優先</small></div><p style="color:var(--muted);font-size:12px">目前畫面使用示範資料。正式介面會顯示來源、最後同步時間與 stale 狀態，不把 mock 假裝成即時資料。</p></div>`; }

    function renderRail() {
      const queueItems = queue.map((id, index) => { const article = articles.find((item) => item.id === id); return `<div class="queue-item"><span class="queue-num">${index + 1}</span><div><button class="queue-title" data-article="${article.id}">${article.title}</button><div class="queue-meta">${article.board} · ${article.time}</div></div><button class="queue-remove" data-remove-queue="${article.id}" aria-label="移除閱讀佇列">×</button></div>`; }).join('');
      $('#rail').innerHTML = `<section class="card rail-card"><div class="rail-head"><h2>稍後閱讀</h2><small>${queue.length} 篇</small></div><div class="queue">${queueItems || '<div class="empty" style="padding:18px 0"><strong>佇列是空的</strong>看到想讀的文章就先收藏。</div>'}</div><button class="text-button" data-view="queue" style="margin-top:12px">管理閱讀佇列 →</button></section><section class="card rail-card"><div class="rail-head"><h2>最近看板</h2><small>剛剛</small></div><div class="queue">${boards.slice(0, 3).map((board) => `<button class="queue-item" style="width:100%;border:0;background:transparent;text-align:left" data-board="${board.name}"><span class="board-avatar" style="width:25px;height:25px;border-radius:8px;font-size:9px">${board.avatar}</span><span class="queue-title">${board.name}</span><span style="color:var(--muted)">›</span></button>`).join('')}</div></section><section class="card rail-card status-card"><h2>資料來源透明</h2><p>目前使用示範資料；正式 adapter 會顯示來源與最後更新時間。</p><div class="status-line"><span class="source-dot"></span>最近同步 6 分鐘前</div></section>`;
    }
    function render() {
      const viewCopy = { home: ['閱讀桌', '把今天想讀的內容放在一起'], boards: ['看板探索', '搜尋、收藏，再開始閱讀'], hot: ['熱門訊號', '依近期活躍度整理'], favorites: ['我的收藏', '留住想回來看的內容'], history: ['閱讀歷史', '回到最近離開的位置'], queue: ['閱讀佇列', '稍後再讀的文章'], settings: ['閱讀偏好', '只存在本機的閱讀設定'], about: ['關於與資料', 'OpenPTT 的產品邊界'] };
      $('#context-title').textContent = viewCopy[currentView][0]; $('#context-note').textContent = viewCopy[currentView][1];
      $('#content').innerHTML = currentView === 'home' ? renderHome() : currentView === 'boards' ? renderBoards() : currentView === 'hot' ? renderHot() : currentView === 'favorites' ? renderFavorites() : currentView === 'history' ? renderHistory() : currentView === 'queue' ? renderQueue() : currentView === 'settings' ? renderSettings() : renderAbout();
      document.querySelectorAll('[data-view]').forEach((button) => button.classList.toggle('active', button.dataset.view === currentView));
      renderRail(); bind();
    }
    function showToast(message) { const toast = $('#toast'); toast.textContent = message; toast.classList.add('show'); clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.classList.remove('show'), 2400); }
    function openArticle(id) { const article = articles.find((item) => item.id === id); if (!article) return; $('#reader-content').innerHTML = `<div class="reader-top"><div><div class="eyebrow">${article.board} · READING VIEW</div><h2>${article.title}</h2><div class="reader-meta">${article.author}　·　${article.time}　·　來源：PTT 公開文章</div></div><button class="reader-close" id="reader-close" aria-label="關閉文章">×</button></div><div class="reader-summary"><span class="push">推 ${article.push}</span><span style="color:var(--boo)">噓 ${article.boo}</span><span>↔ ${article.arrow}</span><span>熱度 78</span></div><div class="reader-body"><p>這是獨立 HTML prototype 的閱讀示意。文章全文在正式版由 server-side adapter 取得，介面會保留看板上下文、來源網址與最近同步時間。</p><blockquote>閱讀是 OpenPTT 的主流程；互動訊號提供判斷線索，但不把使用者推噓操作混進來。</blockquote><p>這個 reader sheet 專注在內容本身，保留足夠的行距與段落寬度，也能在關閉後回到原本的 feed 位置。手機版會改成全頁 reader，避免被多欄 layout 壓縮。</p><p>當文章資料過期或來源受限時，正式 UI 會用人話提示「資料可能已過期」，同時保留可閱讀內容與重新整理入口。</p></div><div class="reader-footer"><button class="secondary" id="reader-back">回到文章列表</button><button class="primary" data-save="${article.id}">${saved.has(article.id) ? '★ 已收藏' : '☆ 收藏文章'}</button></div>`; $('#reader').classList.add('open'); $('#reader-close').focus(); }
    function bind() {
      document.querySelectorAll('[data-view]').forEach((button) => button.addEventListener('click', () => { currentView = button.dataset.view; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }));
      document.querySelectorAll('[data-article]').forEach((button) => button.addEventListener('click', () => openArticle(button.dataset.article)));
      document.querySelectorAll('[data-save]').forEach((button) => button.addEventListener('click', (event) => { event.stopPropagation(); const id = button.dataset.save; if (saved.has(id)) { saved.delete(id); showToast('已取消收藏'); } else { saved.add(id); showToast('已加入收藏'); } render(); }));
      document.querySelectorAll('[data-board]').forEach((button) => button.addEventListener('click', () => { boardFilter = button.dataset.board; currentView = 'home'; render(); }));
      document.querySelectorAll('[data-feed]').forEach((button) => button.addEventListener('click', () => { feedMode = button.dataset.feed; showToast(feedMode === 'hot' ? '已切換為最熱訊號' : feedMode === 'latest' ? '已切換為最新文章' : '已切換為你的閱讀訊號'); render(); }));
      const filter = $('#board-filter'); if (filter) filter.addEventListener('change', (event) => { boardFilter = event.target.value; render(); });
      document.querySelectorAll('[data-remove-queue]').forEach((button) => button.addEventListener('click', () => { const index = queue.indexOf(button.dataset.removeQueue); if (index >= 0) queue.splice(index, 1); showToast('已從閱讀佇列移除'); render(); }));
      document.querySelectorAll('[data-theme-choice]').forEach((button) => button.addEventListener('click', () => applyTheme(button.dataset.themeChoice)));
      const clear = $('#clear-saved'); if (clear) clear.addEventListener('click', () => { saved.clear(); showToast('已清除本機收藏'); render(); });
    }
    function applyTheme(theme) { const resolved = theme === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme; document.documentElement.dataset.theme = resolved; localStorage.setItem('openptt:redesign:theme', theme); $('#theme').textContent = resolved === 'dark' ? '☀' : '☾'; }
    $('#search').addEventListener('input', (event) => { query = event.target.value.trim(); if (currentView !== 'home' && currentView !== 'boards') currentView = 'home'; render(); const search = $('#search'); search.focus(); search.setSelectionRange(query.length, query.length); });
    $('#theme').addEventListener('click', () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
    $('#reader').addEventListener('click', (event) => { if (event.target.id === 'reader' || event.target.id === 'reader-close' || event.target.id === 'reader-back') $('#reader').classList.remove('open'); });
    document.addEventListener('keydown', (event) => { if (event.key === '/' && document.activeElement !== $('#search')) { event.preventDefault(); $('#search').focus(); } if (event.key === 'Escape') $('#reader').classList.remove('open'); });
    applyTheme(localStorage.getItem('openptt:redesign:theme') || 'light'); render();
  </script>
</body>
</html>
