<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f8f6" />
  <title>OpenPTT · 閱讀原型</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f7f8f6;
      --surface: #ffffff;
      --surface-2: #eef3f0;
      --ink-strong: #17332b;
      --ink: #40534c;
      --muted: #7b8a84;
      --line: #dde6e1;
      --brand: #52b99a;
      --brand-strong: #238e6e;
      --brand-soft: #e3f5ee;
      --hot: #e87855;
      --hot-soft: #fff0ea;
      --boo: #cc6570;
      --pin: #c88f28;
      --pin-soft: #fff5dc;
      --shadow: 0 18px 50px rgba(33, 61, 51, .08);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 9px;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --canvas: #111615;
      --surface: #18201e;
      --surface-2: #202b28;
      --ink-strong: #f2f8f5;
      --ink: #c6d2cd;
      --muted: #8e9f98;
      --line: #2c3b36;
      --brand: #62c5a7;
      --brand-strong: #85e3c1;
      --brand-soft: #183d32;
      --hot: #ff9a76;
      --hot-soft: #3b2823;
      --boo: #f28b98;
      --pin: #f0c35c;
      --pin-soft: #3a3020;
      --shadow: 0 18px 50px rgba(0, 0, 0, .22);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font: 14px/1.5 "Noto Sans TC", "PingFang TC", system-ui, sans-serif; }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
    .app { min-height: 100vh; display: flex; }
    .sidebar { width: 240px; min-height: 100vh; position: sticky; top: 0; flex: 0 0 auto; display: flex; flex-direction: column; padding: 24px 16px; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); }
    .brand { display: flex; gap: 11px; align-items: center; padding: 0 10px 28px; }
    .brand-mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; color: #fff; background: var(--brand); font-weight: 850; font-size: 18px; box-shadow: 0 8px 18px rgba(82, 185, 154, .22); }
    .brand strong { display: block; color: var(--ink-strong); letter-spacing: -.03em; }
    .brand small { display: block; color: var(--muted); font-size: 11px; margin-top: 1px; }
    .nav-label { padding: 0 12px 7px; color: var(--muted); font-size: 11px; font-weight: 750; letter-spacing: .09em; }
    .nav { display: grid; gap: 3px; }
    .nav-button { width: 100%; display: flex; align-items: center; gap: 11px; border: 0; border-radius: 10px; padding: 11px 12px; color: var(--muted); background: transparent; text-align: left; font-weight: 650; }
    .nav-button:hover { color: var(--ink-strong); background: var(--surface-2); }
    .nav-button.active { color: var(--ink-strong); background: var(--brand-soft); }
    .nav-icon { width: 19px; text-align: center; font-size: 16px; }
    .sidebar-bottom { margin-top: auto; padding: 15px 10px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .sidebar-bottom strong { color: var(--ink); display: block; margin-bottom: 3px; }
    .main { min-width: 0; flex: 1; }
    .topbar { height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 0 40px; background: color-mix(in srgb, var(--canvas) 88%, transparent); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; backdrop-filter: blur(18px); }
    .topbar-context { color: var(--muted); font-size: 12px; }
    .topbar-context strong { color: var(--ink-strong); font-size: 13px; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .icon-button, .theme-button { width: 40px; height: 40px; display: grid; place-items: center; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 11px; }
    .icon-button:hover, .theme-button:hover { border-color: var(--brand); color: var(--brand-strong); }
    .guest-pill { display: inline-flex; gap: 7px; align-items: center; padding: 8px 11px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; font-size: 12px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); }
    .content { width: min(1180px, 100%); margin: 0 auto; padding: 38px 40px 80px; }
    .page-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
    .eyebrow { color: var(--brand-strong); font-size: 12px; font-weight: 800; letter-spacing: .08em; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 8px; color: var(--ink-strong); font-size: clamp(27px, 3vw, 38px); line-height: 1.15; letter-spacing: -.05em; }
    h2 { color: var(--ink-strong); font-size: 20px; line-height: 1.25; letter-spacing: -.03em; }
    h3 { margin-bottom: 4px; color: var(--ink-strong); font-size: 15px; }
    .lede { max-width: 560px; margin-bottom: 0; color: var(--muted); }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
    .card-pad { padding: 22px; }
    .search-wrap { position: relative; margin-bottom: 26px; }
    .search-wrap::before { content: "⌕"; position: absolute; left: 16px; top: 12px; color: var(--muted); font-size: 22px; line-height: 1; }
    .search-input { width: 100%; height: 52px; padding: 0 84px 0 45px; color: var(--ink-strong); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 6px 18px rgba(33, 61, 51, .04); }
    .search-input::placeholder { color: var(--muted); }
    .search-key { position: absolute; top: 13px; right: 14px; padding: 3px 7px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; font-size: 11px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 30px 0 13px; }
    .section-head h2 { margin-bottom: 0; }
    .section-head a, .text-link { color: var(--brand-strong); font-size: 12px; font-weight: 750; }
    .section-head a:hover, .text-link:hover { text-decoration: underline; }
    .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 28px; }
    .metric { padding: 18px; }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-value { margin: 8px 0 4px; color: var(--ink-strong); font-size: 27px; font-weight: 800; letter-spacing: -.04em; }
    .metric-note { color: var(--muted); font-size: 11px; }
    .board-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .board-card { min-height: 148px; position: relative; display: flex; flex-direction: column; padding: 17px; transition: transform .16s, border-color .16s, background .16s; }
    .board-card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--brand) 60%, var(--line)); }
    .board-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .board-icon { width: 36px; height: 36px; display: grid; place-items: center; margin-bottom: 13px; border-radius: 11px; color: var(--brand-strong); background: var(--brand-soft); font-weight: 850; }
    .favorite { width: 32px; height: 32px; display: grid; place-items: center; flex: 0 0 auto; color: var(--muted); background: transparent; border: 0; border-radius: 9px; font-size: 18px; }
    .favorite:hover, .favorite.is-saved { color: var(--hot); background: var(--hot-soft); }
    .board-name { margin: 0 0 2px; color: var(--ink-strong); font-size: 16px; font-weight: 800; }
    .board-description { min-height: 21px; margin: 0 0 auto; color: var(--muted); font-size: 12px; }
    .board-meta { display: flex; gap: 8px; align-items: center; margin-top: 15px; color: var(--muted); font-size: 11px; }
    .hot-badge, .tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; font-size: 10px; font-weight: 800; }
    .hot-badge { color: var(--hot); background: var(--hot-soft); }
    .tag { color: var(--muted); background: var(--surface-2); }
    .split-grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 16px; }
    .list { display: grid; }
    .list-row { display: flex; align-items: flex-start; gap: 13px; padding: 15px 0; border-bottom: 1px solid var(--line); }
    .list-row:first-child { padding-top: 3px; }
    .list-row:last-child { padding-bottom: 3px; border-bottom: 0; }
    .avatar { width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 10px; color: var(--brand-strong); background: var(--brand-soft); font-weight: 800; }
    .row-main { min-width: 0; flex: 1; }
    .row-title { display: block; margin-bottom: 3px; color: var(--ink-strong); font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-title:hover { color: var(--brand-strong); }
    .row-meta { color: var(--muted); font-size: 11px; }
    .push-stats { display: flex; flex: 0 0 auto; gap: 7px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .push-stats .push { color: var(--hot); }
    .push-stats .boo { color: var(--boo); }
    .stack { display: grid; gap: 10px; }
    .recent-card { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; }
    .recent-card:hover { background: var(--surface-2); }
    .recent-card .row-title { font-size: 13px; }
    .empty { padding: 40px 20px; color: var(--muted); text-align: center; }
    .empty-icon { width: 46px; height: 46px; display: grid; place-items: center; margin: 0 auto 12px; border-radius: 14px; color: var(--brand-strong); background: var(--brand-soft); font-size: 22px; }
    .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .chip, .sort-tab { padding: 8px 13px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; font-size: 12px; font-weight: 700; }
    .chip:hover, .sort-tab:hover { color: var(--ink-strong); border-color: var(--brand); }
    .chip.active, .sort-tab.active { color: var(--brand-strong); background: var(--brand-soft); border-color: color-mix(in srgb, var(--brand) 50%, var(--line)); }
    .board-directory { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .directory-card { display: flex; align-items: center; gap: 13px; min-height: 96px; padding: 16px; }
    .directory-card .board-icon { width: 39px; height: 39px; margin: 0; }
    .directory-card .board-description { margin-top: 4px; }
    .board-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 17px; }
    .breadcrumb { display: flex; gap: 7px; align-items: center; margin-bottom: 11px; color: var(--muted); font-size: 12px; }
    .breadcrumb a:hover { color: var(--brand-strong); }
    .board-head h1 { margin-bottom: 5px; }
    .board-head p { margin-bottom: 0; color: var(--muted); }
    .board-actions { display: flex; align-items: center; gap: 9px; }
    .primary-button, .secondary-button { min-height: 40px; padding: 0 15px; border-radius: 10px; font-weight: 750; }
    .primary-button { color: #fff; background: var(--brand-strong); border: 1px solid var(--brand-strong); }
    .primary-button:hover { filter: brightness(1.05); }
    .secondary-button { color: var(--ink); background: var(--surface); border: 1px solid var(--line); }
    .secondary-button:hover { border-color: var(--brand); }
    .sort-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
    .sort-tabs { display: flex; gap: 6px; }
    .sort-tab { border-radius: 9px; }
    .article-card { position: relative; display: flex; gap: 15px; padding: 18px 4px 18px 18px; border-bottom: 1px solid var(--line); }
    .article-card:last-child { border-bottom: 0; }
    .article-card.is-hot::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 3px; border-radius: 9px; background: var(--hot); }
    .article-card.is-pin::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 3px; border-radius: 9px; background: var(--pin); }
    .article-content { min-width: 0; flex: 1; }
    .badge-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 7px; }
    .article-title { display: block; margin-bottom: 6px; color: var(--ink-strong); font-size: 16px; font-weight: 750; line-height: 1.4; }
    .article-title:hover { color: var(--brand-strong); }
    .article-meta { color: var(--muted); font-size: 11px; }
    .article-stats { display: grid; align-content: center; justify-items: end; gap: 3px; min-width: 70px; font-size: 11px; font-variant-numeric: tabular-nums; }
    .article-stats .push { color: var(--hot); }
    .article-stats .boo { color: var(--boo); }
    .reader { max-width: 820px; margin: 0 auto; }
    .reader-head { padding-bottom: 22px; border-bottom: 1px solid var(--line); }
    .reader h1 { max-width: 760px; margin-bottom: 13px; font-size: clamp(28px, 4vw, 43px); }
    .reader-meta { display: flex; align-items: center; justify-content: space-between; gap: 15px; color: var(--muted); font-size: 12px; }
    .summary { display: flex; flex-wrap: wrap; gap: 20px; margin: 22px 0 28px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 13px; }
    .summary strong { color: var(--ink-strong); font-variant-numeric: tabular-nums; }
    .summary .push { color: var(--hot); }
    .summary .boo { color: var(--boo); }
    .article-body { max-width: 720px; color: var(--ink); font-size: 16px; line-height: 2; }
    .article-body p { margin-bottom: 18px; }
    .article-body blockquote { margin: 23px 0; padding: 12px 17px; color: var(--muted); background: var(--surface-2); border-left: 3px solid var(--brand); border-radius: 0 9px 9px 0; }
    .reader-footer { display: flex; justify-content: space-between; gap: 12px; margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line); }
    .favorite-list { display: grid; gap: 9px; }
    .favorite-item { display: flex; align-items: center; gap: 12px; padding: 14px 15px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
    .favorite-item .row-main { min-width: 0; }
    .favorite-kind { min-width: 35px; color: var(--muted); font-size: 11px; }
    .remove-button { padding: 6px 8px; color: var(--muted); background: transparent; border: 0; border-radius: 7px; font-size: 12px; }
    .remove-button:hover { color: var(--boo); background: var(--hot-soft); }
    .match-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; color: var(--brand-strong); background: var(--brand-soft); border-radius: 999px; font-size: 10px; font-weight: 800; }
    .subscription-overlay { position: fixed; inset: 0; z-index: 15; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(8, 18, 14, .48); }
    .subscription-overlay.is-open { display: flex; }
    .subscription-panel { width: min(520px, 100%); max-height: min(700px, calc(100vh - 40px)); overflow: auto; padding: 24px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 24px 80px rgba(0,0,0,.22); }
    .subscription-panel h2 { margin-bottom: 6px; }
    .subscription-panel .lede { font-size: 12px; }
    .sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 20px; }
    .sheet-close { width: 34px; height: 34px; display: grid; place-items: center; color: var(--muted); background: var(--surface-2); border: 0; border-radius: 9px; font-size: 18px; }
    .sheet-close:hover { color: var(--ink-strong); }
    .subscription-form { display: flex; gap: 8px; margin-bottom: 18px; }
    .subscription-input { min-width: 0; flex: 1; height: 42px; padding: 0 12px; color: var(--ink-strong); background: var(--canvas); border: 1px solid var(--line); border-radius: 9px; }
    .subscription-input::placeholder { color: var(--muted); }
    .subscription-error { min-height: 18px; margin: -9px 0 10px; color: var(--boo); font-size: 11px; }
    .subscription-limit { color: var(--muted); font-size: 11px; }
    .subscription-list { display: grid; gap: 8px; margin-top: 12px; }
    .subscription-row { display: flex; align-items: center; gap: 9px; padding: 10px 11px; background: var(--surface-2); border-radius: 10px; }
    .subscription-row.is-disabled { opacity: .58; }
    .subscription-row .keyword { min-width: 0; flex: 1; color: var(--ink-strong); font-weight: 750; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .subscription-row small { color: var(--muted); font-size: 10px; }
    .toggle-button { min-width: 44px; height: 26px; position: relative; padding: 0; background: var(--line); border: 0; border-radius: 999px; }
    .toggle-button::after { content: ""; width: 20px; height: 20px; position: absolute; left: 3px; top: 3px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
    .toggle-button[aria-pressed="true"] { background: var(--brand); }
    .toggle-button[aria-pressed="true"]::after { transform: translateX(18px); }
    .subscription-note { margin: 18px 0 0; padding-top: 14px; color: var(--muted); border-top: 1px solid var(--line); font-size: 11px; }
    .subscription-group { margin-bottom: 22px; }
    .subscription-group h3 { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .subscription-group h3 span { color: var(--muted); font-size: 11px; font-weight: 500; }
    .mobile-nav { display: none; }
    .mobile-menu-trigger { display: none; }
    .mobile-menu[hidden] { display: none; }
    .mobile-menu { position: fixed; inset: 64px 0 0; z-index: 12; padding: 14px 16px 96px; overflow-y: auto; background: color-mix(in srgb, var(--canvas) 96%, transparent); backdrop-filter: blur(18px); }
    .mobile-menu-panel { padding: 18px; }
    .mobile-menu-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
    .mobile-menu-head h2 { margin: 0; }
    .menu-note { margin: 18px 0 0; color: var(--muted); font-size: 11px; }
    .feature-card { padding: 18px; }
    .feature-card + .feature-card { margin-top: 12px; }
    .feature-card h3 { margin-bottom: 6px; }
    .feature-card p { margin-bottom: 0; color: var(--muted); }
    .feature-status { display: inline-flex; margin-bottom: 10px; padding: 3px 8px; border-radius: 999px; color: var(--brand-strong); background: var(--brand-soft); font-size: 10px; font-weight: 800; }
    .feature-status.deferred { color: var(--muted); background: var(--surface-2); }
    .toast { position: fixed; left: 50%; bottom: 28px; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 11px 15px; color: #fff; background: #18332b; border-radius: 10px; box-shadow: var(--shadow); transform: translate(-50%, 18px); opacity: 0; pointer-events: none; transition: .2s; }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .toast button { padding: 0; color: #9ee9cf; background: transparent; border: 0; font-weight: 800; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 1040px) { .board-grid { grid-template-columns: repeat(2, 1fr); } .board-directory { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 767px) {
      .app { display: block; }
      .sidebar { display: none; }
      .topbar { height: 64px; padding: 0 16px; }
      .topbar-context { display: none; }
      .mobile-menu-trigger { display: grid; }
      .guest-pill { padding: 7px 9px; }
      .content { padding: 27px 16px 96px; }
      .page-heading { display: block; }
      .page-heading .secondary-button { margin-top: 14px; }
      .metric-grid { grid-template-columns: 1fr; gap: 9px; }
      .metric { padding: 15px; }
      .metric-value { display: inline; margin-right: 7px; font-size: 24px; }
      .board-grid, .board-directory, .split-grid { grid-template-columns: 1fr; }
      .card-pad { padding: 17px; }
      .section-head { margin-top: 25px; }
      .board-head { display: block; }
      .board-actions { margin-top: 15px; }
      .sort-bar { align-items: flex-start; flex-direction: column; }
      .sort-tabs { width: 100%; overflow-x: auto; padding-bottom: 2px; }
      .sort-tab { white-space: nowrap; }
      .article-card { padding-left: 13px; gap: 10px; }
      .article-stats { min-width: 54px; }
      .article-title { font-size: 15px; }
      .reader-meta { align-items: flex-start; flex-direction: column; }
      .reader h1 { font-size: 29px; }
      .article-body { font-size: 15px; line-height: 1.9; }
      .reader-footer { flex-direction: column; }
      .subscription-overlay { align-items: flex-end; padding: 0; }
      .subscription-panel { max-height: 88vh; padding: 21px 17px calc(21px + env(safe-area-inset-bottom)); border-radius: 18px 18px 0 0; }
      .subscription-form { align-items: stretch; flex-direction: column; }
      .subscription-form .primary-button { width: 100%; }
      .mobile-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: repeat(4, 1fr); padding: 7px 4px calc(7px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--surface) 93%, transparent); border-top: 1px solid var(--line); backdrop-filter: blur(18px); }
      .mobile-nav button { display: grid; gap: 2px; place-items: center; padding: 4px 2px; color: var(--muted); background: transparent; border: 0; font-size: 10px; }
      .mobile-nav button.active { color: var(--brand-strong); font-weight: 800; }
      .mobile-nav .nav-icon { font-size: 17px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="側邊導覽">
      <a class="brand" href="#home" data-route="home" aria-label="回到 OpenPTT 首頁">
        <span class="brand-mark">O</span><span><strong>OpenPTT</strong><small>閱讀模式 · prototype</small></span>
      </a>
      <div class="nav-label">瀏覽</div>
      <nav class="nav" id="desktop-nav">

  <script>
    const boards = [
      { name: 'Gossiping', category: '娛樂', description: '八卦與即時話題', subscribers: 380000, hot: true },
      { name: 'Stock', category: '財經', description: '股票與市場討論', subscribers: 125000, hot: true },
      { name: 'Tech_Job', category: '科技', description: '科技業職涯與面試', subscribers: 85000, hot: true },
      { name: 'PC_Shopping', category: '科技', description: '電腦選購與組裝', subscribers: 62000, hot: true },
      { name: 'NBA', category: '運動', description: '籃球賽事與球員討論', subscribers: 76000, hot: true },
      { name: 'Lifeismoney', category: '生活', description: '省錢與消費情報', subscribers: 58000 },
      { name: 'movie', category: '娛樂', description: '電影心得與推薦', subscribers: 52000 },
      { name: 'MobileComm', category: '科技', description: '手機與行動通訊', subscribers: 41000 },
      { name: 'Baseball', category: '運動', description: '棒球賽事與球員討論', subscribers: 39000 },
      { name: 'Food', category: '生活', description: '美食、餐廳與料理', subscribers: 36000 },
      { name: 'Japan_Travel', category: '旅遊', description: '日本旅行情報', subscribers: 29000 }
    ];
    const articles = [
      { id: 'g-1', board: 'Gossiping', title: '[爆卦] 今年夏天最有感的三件事', tags: ['爆卦'], author: 'sakura77', time: '10 分鐘前', pushes: 182, boos: 9, arrows: 36, hot: true, pin: false, body: ['早上打開社群，發現大家討論的事情比想像中還要集中。整理幾個今天看到的觀察，給還沒跟上的板友。', '第一件是生活節奏真的變快了，第二件是大家開始更在意資訊來源，第三件則是週末出門的人比去年多。'] },
      { id: 't-1', board: 'Tech_Job', title: '[心得] 轉職半年後，我最後悔太晚做的準備', tags: ['心得', '職涯'], author: 'backend_newbie', time: '24 分鐘前', pushes: 96, boos: 3, arrows: 18, hot: true, pin: false, body: ['去年底決定從維運轉後端，花了六個月重新整理基礎與作品集。這篇想記錄幾個當時沒有人告訴我的細節。', '最重要的是先把想投的職缺拆成能力清單，而不是無止境地買課程。每週固定完成一個小作品，面試時真的很有幫助。'] },
      { id: 's-1', board: 'Stock', title: '[請益] 新手建立投資紀律，第一步該做什麼？', tags: ['請益'], author: 'slow_and_steady', time: '38 分鐘前', pushes: 61, boos: 5, arrows: 27, hot: false, pin: true, body: ['剛開始工作，想從每月固定投入開始建立習慣，但面對很多資訊反而不知道怎麼選擇。想請教有經驗的板友，第一年最該練習的事情是什麼？'] },
      { id: 'n-1', board: 'NBA', title: '季後賽觀察：這支球隊的防守調整很值得研究', tags: ['討論'], author: 'baseline_reader', time: '1 小時前', pushes: 48, boos: 2, arrows: 12, hot: false, pin: false, body: ['這場比賽最精彩的不只是最後一擊，而是第三節之後的防守輪轉。把持球點逼到弱側後，整個進攻節奏就被打亂。'] },
      { id: 'm-1', board: 'movie', title: '[雷] 看完這部片，才發現預告藏了這個細節', tags: ['雷', '心得'], author: 'cinema_walk', time: '2 小時前', pushes: 33, boos: 7, arrows: 8, hot: false, pin: false, body: ['以下有雷。第二幕出現的那個鏡頭，第一次看以為是氣氛鋪陳，回頭想才知道其實已經把結局說得很清楚。'] }
    ];
    const categories = ['全部', '財經', '科技', '娛樂', '運動', '感情', '生活', '旅遊'];
    const saved = new Set(JSON.parse(localStorage.getItem('openptt:prototype:favorites') || '[]'));
    const subscriptions = JSON.parse(localStorage.getItem('openptt:prototype:keyword-subscriptions') || '[]');
    let route = location.hash.replace('#', '') || 'home';
    let query = '';
    let category = '全部';
    let sort = 'hot';
    let selectedBoard = 'Gossiping';
    let selectedArticle = 'g-1';
    let subscriptionSheetBoard = null;
    let toastTimer;

    const $ = (selector) => document.querySelector(selector);
    const esc = (value) => String(value).replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[char]));
    const getBoard = (name) => boards.find((board) => board.name === name) || boards[0];
    const getArticle = (id) => articles.find((article) => article.id === id) || articles[0];
    const formatNumber = (value) => value.toLocaleString('en-US');
    function persistFavorites() { localStorage.setItem('openptt:prototype:favorites', JSON.stringify([...saved])); }
    function persistSubscriptions() { localStorage.setItem('openptt:prototype:keyword-subscriptions', JSON.stringify(subscriptions)); }
    function boardSubscriptions(board) { return subscriptions.filter((subscription) => subscription.board === board); }
    function normalizeKeyword(keyword) { return keyword.trim().toLocaleLowerCase(); }
    function keywordMatches(article) {
      const haystack = String(article.title) + ' ' + (article.body?.join(' ') || '') + ' ' + article.tags.join(' ');
      const normalizedHaystack = haystack.toLocaleLowerCase();
      return subscriptions.filter((subscription) => subscription.enabled && subscription.board === article.board && normalizedHaystack.includes(normalizeKeyword(subscription.keyword)));
    }
    function addSubscription(board, keyword) {
      const clean = keyword.trim(); const normalized = normalizeKeyword(clean); const current = boardSubscriptions(board);
      if (!clean) return '請輸入要追蹤的關鍵字。';
      if (current.some((subscription) => normalizeKeyword(subscription.keyword) === normalized)) return '這個看板已經有相同的關鍵字。';
      if (current.length >= 10) return '這個看板已達 10 筆訂閱上限，請先刪除或停用一筆。';
      if (subscriptions.length >= 30) return '全站已達 30 筆訂閱上限，請先到設定刪除不需要的項目。';
      subscriptions.push({ id: 'subscription-' + Date.now(), board, keyword: clean, enabled: true, createdAt: Date.now() }); persistSubscriptions(); showToast('已訂閱 ' + board + ' 的「' + clean + '」'); subscriptionSheetBoard = null; return '';
    }
    function removeSubscription(id) { const index = subscriptions.findIndex((subscription) => subscription.id === id); if (index >= 0) { const [removed] = subscriptions.splice(index, 1); persistSubscriptions(); showToast('已移除「' + removed.keyword + '」訂閱'); } }
    function toggleSubscription(id) { const subscription = subscriptions.find((item) => item.id === id); if (subscription) { subscription.enabled = !subscription.enabled; persistSubscriptions(); } }
    function isSaved(id) { return saved.has(id); }
    function toggleFavorite(id, label) {
      if (saved.has(id)) { saved.delete(id); showToast(`已移除「${label}」`); }
      else { saved.add(id); showToast(`已收藏「${label}」`); }
      persistFavorites(); render();
    }
    function showToast(message) {
      clearTimeout(toastTimer); $('#toast-message').textContent = message; $('#toast').classList.add('show');
      toastTimer = setTimeout(() => $('#toast').classList.remove('show'), 2600);
    }
    function boardCard(board, directory = false) {
      const letter = board.name.charAt(0).toUpperCase();
      return `<article class="${directory ? 'directory-card' : 'board-card'} card">
        <div class="board-top"><span class="board-icon">${esc(letter)}</span><button class="favorite ${isSaved('board:' + board.name) ? 'is-saved' : ''}" data-favorite="board:${esc(board.name)}" data-label="${esc(board.name)}" aria-label="${isSaved('board:' + board.name) ? '取消收藏' : '收藏'} ${esc(board.name)}" aria-pressed="${isSaved('board:' + board.name)}">${isSaved('board:' + board.name) ? '★' : '☆'}</button></div>
        <a href="#board/${encodeURIComponent(board.name)}" class="board-name">${esc(board.name)}</a>
        <p class="board-description">${esc(board.description)}</p>
        <div class="board-meta">${board.hot ? '<span class="hot-badge">ϟ 熱門</span>' : ''}<span>${esc(board.category)}</span><span>·</span><span>${formatNumber(board.subscribers)} 人</span></div>
      </article>`;
    }
   function articleRow(article, compact = false) {
      const matches = keywordMatches(article);
      if (matches.length) article = { ...article, tags: [...article.tags, '命中：' + matches[0].keyword] };
     return `<article class="${compact ? 'list-row' : 'article-card'} ${article.hot ? 'is-hot' : article.pin ? 'is-pin' : ''}">
        ${compact ? '<span class="avatar">' + esc(article.board.charAt(0)) + '</span>' : ''}<div class="${compact ? 'row-main' : 'article-content'}">
          ${compact ? '' : `<div class="badge-row">${article.pin ? '<span class="tag" style="color:var(--pin)">📌 置頂</span>' : ''}${article.hot ? '<span class="hot-badge">ϟ 熱門</span>' : ''}${article.tags.map((tag) => `<span class="tag">${esc(tag)}</span>`).join('')}</div>`}
          <a href="#article/${article.id}" class="${compact ? 'row-title' : 'article-title'}">${esc(article.title)}</a>
          <div class="${compact ? 'row-meta' : 'article-meta'}">${esc(article.board)}　·　${esc(article.author)}　·　${esc(article.time)}</div>
        </div>
        <div class="${compact ? 'push-stats' : 'article-stats'}"><span class="push">${article.pushes} 推</span><span class="boo">${article.boos} 噓</span><span>${article.arrows} →</span></div>
      </article>`;
    }
    function renderHome() {
      const hotBoards = boards.filter((board) => board.hot).slice(0, 4);
      return `<div class="page-heading"><div><div class="eyebrow">GOOD TO SEE YOU</div><h1>今天想看哪個板？</h1><p class="lede">把 PTT 的高密度資訊，整理成更容易閱讀的節奏。</p></div><button class="secondary-button" data-route="settings">⚙ 閱讀偏好</button></div>
        <div class="search-wrap"><label class="sr-only" for="global-search">搜尋看板或文章</label><input id="global-search" class="search-input" value="${esc(query)}" placeholder="搜尋看板或文章" autocomplete="off"><span class="search-key">按 / 搜尋</span></div>
        <div class="metric-grid"><div class="metric card"><div class="metric-label">已收藏看板</div><div class="metric-value">${[...saved].filter((id) => id.startsWith('board:')).length}</div><div class="metric-note">在本機保存</div></div><div class="metric card"><div class="metric-label">熱門看板</div><div class="metric-value">${boards.filter((board) => board.hot).length}</div><div class="metric-note">今天的討論入口</div></div><div class="metric card"><div class="metric-label">資料狀態</div><div class="metric-value" style="font-size:20px">示範資料</div><div class="metric-note">最後更新於剛剛</div></div></div>
        <div class="section-head"><h2>熱門看板</h2><a href="#boards">查看全部 →</a></div><div class="board-grid">${hotBoards.map((board) => boardCard(board)).join('')}</div>
        <div class="split-grid"><section><div class="section-head"><h2>熱門文章</h2><a href="#hot">更多文章 →</a></div><div class="card card-pad list">${articles.slice(0, 4).map((article) => articleRow(article, true)).join('')}</div></section><section><div class="section-head"><h2>繼續閱讀</h2><span class="text-link">最近瀏覽</span></div><div class="card card-pad stack"><a class="recent-card" href="#board/Tech_Job"><span class="avatar">T</span><span class="row-main"><strong class="row-title">Tech_Job</strong><small class="row-meta">上次閱讀 · 12 分鐘前</small></span><span>→</span></a><a class="recent-card" href="#article/s-1"><span class="avatar">S</span><span class="row-main"><strong class="row-title">[請益] 新手建立投資紀律...</strong><small class="row-meta">Stock · 尚未讀完</small></span><span>→</span></a></div></section></div>`;
    }
   function renderBoards() {
     const filtered = boards.filter((board) => (category === '全部' || board.category === category) && `${board.name} ${board.description} ${board.category}`.toLowerCase().includes(query.toLowerCase()));
     return `<div class="page-heading"><div><div class="eyebrow">DISCOVER</div><h1>看板列表</h1><p class="lede">用分類或搜尋，找到下一個想加入閱讀清單的地方。</p></div><span class="guest-pill">${filtered.length} / ${boards.length} 個看板</span></div>
       <div class="search-wrap"><label class="sr-only" for="board-search">搜尋看板</label><input id="board-search" class="search-input" value="${esc(query)}" placeholder="搜尋看板名稱、描述或分類" autocomplete="off"><span class="search-key">⌘ K</span></div>
       <div class="toolbar" aria-label="看板分類">${categories.map((item) => `<button class="chip ${category === item ? 'active' : ''}" data-category="${item}" aria-pressed="${category === item}">${item}</button>`).join('')}</div>
       ${filtered.length ? `<div class="board-directory">${filtered.map((board) => boardCard(board, true)).join('')}</div>` : `<div class="card empty"><div class="empty-icon">⌕</div><h3>找不到相關看板</h3><p>換個關鍵字，或清除分類篩選試試看。</p><button class="secondary-button" data-clear-search>清除搜尋</button></div>`}`;
   }
    function renderSubscriptionSheet(board) {
      const list = boardSubscriptions(board.name);
      const rows = list.length ? list.map((subscription) => '<div class="subscription-row ' + (subscription.enabled ? '' : 'is-disabled') + '"><span class="keyword">' + esc(subscription.keyword) + '</span><small>' + (subscription.enabled ? '啟用中' : '已停用') + '</small><button class="toggle-button" data-subscription-toggle="' + subscription.id + '" aria-label="切換 ' + esc(subscription.keyword) + '" aria-pressed="' + subscription.enabled + '"></button><button class="remove-button" data-subscription-remove="' + subscription.id + '">刪除</button></div>').join('') : '<div class="empty" style="padding:20px 0"><div class="empty-icon">⌕</div><p>還沒有追蹤字詞，先建立一筆吧。</p></div>';
      return '<div class="subscription-overlay' + (subscriptionSheetBoard === board.name ? ' is-open' : '') + '" data-subscription-overlay aria-hidden="' + (subscriptionSheetBoard === board.name ? 'false' : 'true') + '"><div class="subscription-panel" role="dialog" aria-modal="true" aria-labelledby="subscription-title"><div class="sheet-head"><div><h2 id="subscription-title">訂閱 ' + esc(board.name) + ' 的關鍵字</h2><p class="lede">只比對這個看板的標題、內文與標籤。</p></div><button class="sheet-close" data-close-subscriptions aria-label="關閉關鍵字訂閱">×</button></div><form class="subscription-form" id="subscription-form"><label class="sr-only" for="subscription-keyword">輸入關鍵字</label><input class="subscription-input" id="subscription-keyword" placeholder="例如：投資、面試、湖人" maxlength="40" required><button class="primary-button" type="submit">建立訂閱</button></form><p class="subscription-error" id="subscription-error" aria-live="polite"></p><div class="subscription-limit">' + list.length + ' / 10 筆看板訂閱　·　全站上限 30 筆</div><div class="subscription-list">' + rows + '</div><p class="subscription-note">示範資料只顯示站內命中提示，不會送出 Web Push；訂閱只保存在這個瀏覽器。</p></div></div>';
    }
   function renderBoard(name) {
      const board = getBoard(name); const matching = articles.filter((article) => article.board === board.name); const items = matching.length ? matching : articles.slice(0, 3).map((article, index) => ({ ...article, id: `${board.name}-${index + 1}`, board: board.name }));
      const sorted = [...items].sort((a, b) => sort === 'hot' ? b.pushes - a.pushes : sort === 'pin' ? Number(b.pin) - Number(a.pin) : a.time.localeCompare(b.time));
      return `<div class="breadcrumb"><a href="#boards">看板列表</a><span>/</span><span>${esc(board.name)}</span></div><div class="board-head"><div><h1>${esc(board.name)}</h1><p>${esc(board.description)}　·　${formatNumber(board.subscribers)} 人收藏這個板</p></div><div class="board-actions"><button class="favorite ${isSaved('board:' + board.name) ? 'is-saved' : ''}" data-favorite="board:${esc(board.name)}" data-label="${esc(board.name)}" aria-label="收藏 ${esc(board.name)}" aria-pressed="${isSaved('board:' + board.name)}">${isSaved('board:' + board.name) ? '★' : '☆'}</button><button class="primary-button" data-route="favorites">查看收藏</button></div></div><section class="card card-pad"><div class="sort-bar"><strong style="color:var(--ink-strong)">${items.length + 18} 篇文章</strong><div class="sort-tabs">${[['time','最新'],['hot','熱門'],['pin','板主推薦']].map(([key,label]) => `<button class="sort-tab ${sort === key ? 'active' : ''}" data-sort="${key}" aria-pressed="${sort === key}">${label}</button>`).join('')}</div></div><div>${sorted.map((article) => articleRow(article)).join('')}</div></section>`;
    }
    function renderArticle(id) {
      const article = getArticle(id); return `<div class="reader"><div class="breadcrumb"><a href="#board/${encodeURIComponent(article.board)}">${esc(article.board)}</a><span>/</span><span>文章閱讀</span></div><article class="reader-head"><div class="badge-row">${article.hot ? '<span class="hot-badge">ϟ 熱門文章</span>' : ''}${article.pin ? '<span class="tag" style="color:var(--pin)">📌 板主推薦</span>' : ''}${article.tags.map((tag) => `<span class="tag">${esc(tag)}</span>`).join('')}</div><h1>${esc(article.title)}</h1><div class="reader-meta"><span>${esc(article.author)}　·　${esc(article.time)}　·　IP region：TW</span><button class="secondary-button" data-favorite="article:${article.id}" data-label="${esc(article.title)}" aria-pressed="${isSaved('article:' + article.id)}">${isSaved('article:' + article.id) ? '★ 已收藏' : '☆ 收藏文章'}</button></div></article><div class="summary"><span class="push">▲ <strong>${article.pushes}</strong> 推</span><span class="boo">▼ <strong>${article.boos}</strong> 噓</span><span>→ <strong>${article.arrows}</strong></span><span>推噓比 <strong>${(article.pushes / Math.max(article.boos, 1)).toFixed(1)} : 1</strong></span></div><div class="article-body">${article.body.map((paragraph, index) => index === 1 ? `<blockquote>${esc(paragraph)}</blockquote>` : `<p>${esc(paragraph)}</p>`).join('')}<p>— 以上為 OpenPTT 示範資料，實際內容需接入 typed data adapter。</p></div><div class="reader-footer"><a class="text-link" href="#board/${encodeURIComponent(article.board)}">← 回到 ${esc(article.board)}</a><span class="row-meta">示範資料 · 最後更新於剛剛</span></div></div>`;
   }
    function renderHistory() {
      return `<div class="page-heading"><div><div class="eyebrow">READING HISTORY</div><h1>閱讀歷史</h1><p class="lede">接著看你剛剛讀過的板與文章；歷史只保存在這個瀏覽器。</p></div><button class="secondary-button" data-clear-history>清除歷史</button></div><div class="split-grid"><section><div class="section-head"><h2>最近看板</h2><span class="text-link">2 個看板</span></div><div class="card card-pad stack"><a class="recent-card" href="#board/Tech_Job"><span class="avatar">T</span><span class="row-main"><strong class="row-title">Tech_Job</strong><small class="row-meta">上次閱讀 · 12 分鐘前</small></span><span>→</span></a><a class="recent-card" href="#board/Stock"><span class="avatar">S</span><span class="row-main"><strong class="row-title">Stock</strong><small class="row-meta">上次閱讀 · 38 分鐘前</small></span><span>→</span></a></div></section><section><div class="section-head"><h2>最近文章</h2><span class="text-link">3 篇文章</span></div><div class="card card-pad list">${articles.slice(1, 4).map((article) => articleRow(article, true)).join('')}</div></section></div>`;
    }
    function renderBoardHistory() {
      return '<div class="page-heading"><div><div class="eyebrow">BOARD HISTORY</div><h1>看板歷史</h1><p class="lede">快速回到最近看過的板；這是閱讀歷史的看板視角。</p></div><button class="secondary-button" data-clear-history>清除歷史</button></div><div class="card card-pad stack"><a class="recent-card" href="#board/Tech_Job"><span class="avatar">T</span><span class="row-main"><strong class="row-title">Tech_Job</strong><small class="row-meta">科技業職涯與面試 · 上次閱讀 12 分鐘前</small></span><span>→</span></a><a class="recent-card" href="#board/Stock"><span class="avatar">S</span><span class="row-main"><strong class="row-title">Stock</strong><small class="row-meta">股票與市場討論 · 上次閱讀 38 分鐘前</small></span><span>→</span></a><a class="recent-card" href="#board/Baseball"><span class="avatar">B</span><span class="row-main"><strong class="row-title">Baseball</strong><small class="row-meta">棒球賽事與球員討論 · 上次閱讀昨天</small></span><span>→</span></a></div>';
    }
    function renderFavorites() {
      const items = [...saved].map((key) => { const [type, id] = key.split(':'); return { key, type, id, label: type === 'board' ? getBoard(id).name : getArticle(id).title, meta: type === 'board' ? getBoard(id).description : `${getArticle(id).board} · ${getArticle(id).time}` }; });
      return `<div class="page-heading"><div><div class="eyebrow">YOUR READING LIST</div><h1>我的收藏</h1><p class="lede">把想回來看的板與文章，留在同一個清單裡。</p></div></div>${items.length ? `<div class="favorite-list">${items.map((item) => `<div class="favorite-item"><span class="favorite-kind">${item.type === 'board' ? '看板' : '文章'}</span><span class="avatar">${esc(item.label.charAt(0))}</span><span class="row-main"><a class="row-title" href="#${item.type === 'board' ? 'board/' + encodeURIComponent(item.id) : 'article/' + encodeURIComponent(item.id)}">${esc(item.label)}</a><small class="row-meta">${esc(item.meta)}</small></span><button class="remove-button" data-favorite="${esc(item.key)}" data-label="${esc(item.label)}">移除</button></div>`).join('')}</div>` : `<div class="card empty"><div class="empty-icon">☆</div><h3>還沒有收藏</h3><p>在看板或文章頁按下收藏，之後就能從這裡回來。</p><a class="primary-button" href="#boards" style="display:inline-flex;align-items:center">探索看板</a></div>`}`;
    }
    function renderHot() { return `<div class="page-heading"><div><div class="eyebrow">TRENDING NOW</div><h1>熱門文章</h1><p class="lede">依推文訊號整理的閱讀入口，適合快速掃一輪。</p></div></div><section class="card card-pad">${[...articles].sort((a,b) => b.pushes - a.pushes).map((article) => articleRow(article)).join('')}</section>`; }
    function renderSettings() { return `<div class="page-heading"><div><div class="eyebrow">PREFERENCES</div><h1>閱讀偏好</h1><p class="lede">目前所有偏好只保存在這個瀏覽器，不需要登入。</p></div></div><section class="card card-pad"><h2>主題</h2><p class="lede" style="margin-bottom:17px">選擇符合環境的閱讀色彩。</p><div class="toolbar"><button class="chip" data-theme-choice="system">系統</button><button class="chip" data-theme-choice="light">淺色</button><button class="chip" data-theme-choice="dark">深色</button></div><hr style="border:0;border-top:1px solid var(--line);margin:23px 0"><h2>資料與隱私</h2><p class="lede">這份原型使用示範資料；收藏與主題使用 localStorage，不會送到伺服器。</p><button class="secondary-button" data-clear-favorites>清除本機收藏</button></section>`; }
    function renderArticleFavorites() {
      const articleKeys = [...saved].filter((key) => key.startsWith('article:'));
      if (!articleKeys.length) return '<div class="page-heading"><div><div class="eyebrow">ARTICLE BOOKMARKS</div><h1>文章收藏</h1><p class="lede">從文章閱讀頁收藏的內容會集中在這裡。</p></div></div><div class="card empty"><div class="empty-icon">▣</div><h3>還沒有收藏文章</h3><p>打開一篇文章，按下「收藏文章」就會出現在這裡。</p><a class="primary-button" href="#hot" style="display:inline-flex;align-items:center">瀏覽熱門文章</a></div>';
      return '<div class="page-heading"><div><div class="eyebrow">ARTICLE BOOKMARKS</div><h1>文章收藏</h1><p class="lede">只顯示文章收藏；看板收藏仍保留在「我的收藏」。</p></div></div><div class="favorite-list">' + articleKeys.map((key) => { const id = key.slice(8); const article = getArticle(id); return '<div class="favorite-item"><span class="favorite-kind">文章</span><span class="avatar">' + esc(article.board.charAt(0)) + '</span><span class="row-main"><a class="row-title" href="#article/' + encodeURIComponent(id) + '">' + esc(article.title) + '</a><small class="row-meta">' + esc(article.board) + ' · ' + esc(article.time) + '</small></span><button class="remove-button" data-favorite="' + esc(key) + '" data-label="' + esc(article.title) + '">移除</button></div>'; }).join('') + '</div>';
    }
    function renderLiveHot() { return '<div class="page-heading"><div><div class="eyebrow">LIVE TRENDING</div><h1>即時熱門</h1><p class="lede">參考對標 App 的即時熱門入口；prototype 以 mock feed 展示更新與熱度層級。</p></div><button class="secondary-button" data-refresh-hot>↻ 重新整理</button></div><div class="card card-pad" style="margin-bottom:16px;text-align:center;color:var(--muted)">更新：13 分鐘前　·　顯示分級限制看板熱門文章</div><section class="card card-pad">' + [...articles].sort((a,b) => b.pushes - a.pushes).map((article) => articleRow(article)).join('') + '</section>'; }
    function renderGroups() { return '<div class="page-heading"><div><div class="eyebrow">GROUPS</div><h1>分組討論</h1><p class="lede">保留對標 App 的功能入口，但目前尚未建立帳號與社交層。</p></div></div><div class="card feature-card"><span class="feature-status deferred">延後 · P2</span><h3>分組與自訂討論群</h3><p>需要跨看板群組、成員權限與同步資料；目前先用收藏與關鍵字訂閱完成個人閱讀整理。</p></div><div class="card feature-card"><span class="feature-status">目前可用</span><h3>替代路徑</h3><p>用「我的收藏」保存看板，再從看板頁建立指定看板的關鍵字訂閱。</p><p style="margin-top:12px"><a class="text-link" href="#favorites">前往我的收藏 →</a></p></div>'; }
    function renderDeferred(title, eyebrow, description, reason) { return '<div class="page-heading"><div><div class="eyebrow">' + eyebrow + '</div><h1>' + title + '</h1><p class="lede">' + description + '</p></div></div><div class="card feature-card"><span class="feature-status deferred">尚未納入 MVP</span><h3>功能入口已保留</h3><p>' + reason + '</p><p style="margin-top:12px"><a class="text-link" href="#about">查看產品邊界與資料來源 →</a></p></div>'; }
    function renderAbout() { return '<div class="page-heading"><div><div class="eyebrow">ABOUT OPENPTT</div><h1>關於 OpenPTT</h1><p class="lede">一個 reading-first、guest-first 的 PTT 閱讀介面 prototype。</p></div></div><div class="card feature-card"><span class="feature-status">Prototype scope</span><h3>目前已展示</h3><p>看板探索、熱門與即時熱門、文章閱讀、收藏、閱讀／看板歷史、指定看板關鍵字訂閱、主題偏好。</p></div><div class="card feature-card"><span class="feature-status deferred">資料狀態</span><h3>示範資料與產品邊界</h3><p>內容為 mock，收藏、主題與關鍵字訂閱保存在瀏覽器 localStorage。尚未接入帳號、私人信件、發文互動、Web Push 或正式資料 adapter。</p></div>'; }
    function renderSubscriptionManager() {
      const groups = boards.filter((board) => boardSubscriptions(board.name).length).map((board) => {
        const rows = boardSubscriptions(board.name).map((subscription) => '<div class="subscription-row ' + (subscription.enabled ? '' : 'is-disabled') + '"><span class="keyword">' + esc(subscription.keyword) + '</span><small>' + (subscription.enabled ? '啟用中' : '已停用') + '</small><button class="toggle-button" data-subscription-toggle="' + subscription.id + '" aria-label="切換 ' + esc(subscription.keyword) + '" aria-pressed="' + subscription.enabled + '"></button><button class="remove-button" data-subscription-remove="' + subscription.id + '">刪除</button></div>').join('');
        return '<div class="subscription-group"><h3>' + esc(board.name) + '<span>' + boardSubscriptions(board.name).length + ' / 10</span></h3><div class="subscription-list">' + rows + '</div></div>';
      }).join('');
      return '<hr style="border:0;border-top:1px solid var(--line);margin:23px 0"><h2>關鍵字訂閱</h2><p class="lede">從看板頁建立訂閱；目前只提供站內命中提示，不會送出推播。</p>' + (groups || '<div class="empty" style="padding:24px 0"><div class="empty-icon">⌕</div><p>還沒有任何關鍵字訂閱。</p><a class="text-link" href="#boards">先去探索看板 →</a></div>') + '<p class="subscription-note">訂閱只保存在這個瀏覽器；每個看板最多 10 筆，全站最多 30 筆。</p>';
    }
    function render() {
      const parts = route.split('/'); let html;
      if (route === 'home') html = renderHome(); else if (route === 'boards') html = renderBoards(); else if (route === 'hot') html = renderHot(); else if (route === 'live-hot') html = renderLiveHot(); else if (route === 'favorites') html = renderFavorites(); else if (route === 'article-favorites') html = renderArticleFavorites(); else if (route === 'groups') html = renderGroups(); else if (route === 'history') html = renderHistory(); else if (route === 'board-history') html = renderBoardHistory(); else if (route === 'push-history') html = renderDeferred('推文歷史', 'PUSH HISTORY', '保留對標 App 的入口，但 OpenPTT MVP 暫不支援登入後的互動紀錄。', '推文歷史需要帳號、發文與推文事件資料；目前只提供閱讀與收藏。'); else if (route === 'image-history') html = renderDeferred('圖片上傳紀錄', 'IMAGE HISTORY', '保留功能地圖位置，避免把尚未存在的上傳能力做成假功能。', 'OpenPTT 現階段是閱讀器，不提供圖片上傳與個人媒體管理。'); else if (route === 'donate') html = renderDeferred('贊助', 'SUPPORT', '對標 App 的贊助入口先保留在功能地圖中。', '目前沒有付費、捐款或帳務流程，避免在 prototype 中建立不可用的付款承諾。'); else if (route === 'about') html = renderAbout(); else if (route === 'settings') html = renderSettings(); else if (parts[0] === 'board') { selectedBoard = decodeURIComponent(parts[1] || 'Gossiping'); html = renderBoard(selectedBoard); } else if (parts[0] === 'article') { selectedArticle = parts[1] || 'g-1'; html = renderArticle(selectedArticle); } else { route = 'home'; html = renderHome(); }
      $('#view').innerHTML = html; updateNav(); bindView(); $('#context-label').textContent = route.startsWith('board') ? selectedBoard : route.startsWith('article') ? '文章閱讀' : ({ home:'首頁', boards:'看板列表', hot:'熱門文章', 'live-hot':'即時熱門', favorites:'我的收藏', 'article-favorites':'文章收藏', groups:'分組討論', history:'閱讀歷史', 'board-history':'看板歷史', 'push-history':'推文歷史', 'image-history':'圖片上傳紀錄', settings:'閱讀偏好', donate:'贊助', about:'關於' }[route] || '首頁');
    }
    function updateNav() { const activeRoute = route.startsWith('board/') || route.startsWith('article/') ? 'boards' : route === 'article-favorites' ? 'favorites' : route; document.querySelectorAll('[data-route]').forEach((item) => item.classList.toggle('active', item.dataset.route === activeRoute)); }
    function go(next) { route = next; location.hash = next; closeMobileMenu(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    function closeMobileMenu() { const menu = $('#mobile-menu'); const trigger = $('#mobile-menu-toggle'); if (menu && trigger) { menu.hidden = true; trigger.setAttribute('aria-expanded', 'false'); } }
    function bindView() {
      const menu = $('#mobile-menu');
      const menuToggle = $('#mobile-menu-toggle');
      const menuClose = $('#mobile-menu-close');
      if (menuToggle) menuToggle.onclick = () => { menu.hidden = !menu.hidden; menuToggle.setAttribute('aria-expanded', String(!menu.hidden)); };
      if (menuClose) menuClose.onclick = closeMobileMenu;
      if (menu) menu.onclick = (event) => { if (event.target === menu) closeMobileMenu(); };
      if (route === 'settings') {
        const settingsCard = document.querySelector('.card.card-pad');
        if (settingsCard) settingsCard.insertAdjacentHTML('beforeend', renderSubscriptionManager());
      }
      if (route.startsWith('board/')) {
        const board = getBoard(selectedBoard);
        const actions = document.querySelector('.board-actions');
        if (actions) {
          actions.insertAdjacentHTML('afterbegin', '<button class="secondary-button" data-open-subscriptions>⌕ 關鍵字訂閱' + (boardSubscriptions(board.name).length ? ' (' + boardSubscriptions(board.name).length + ')' : '') + '</button>');
          $('#view').insertAdjacentHTML('beforeend', renderSubscriptionSheet(board));
        }
      }
      document.querySelectorAll('[data-open-subscriptions]').forEach((button) => button.addEventListener('click', () => { subscriptionSheetBoard = selectedBoard; render(); }));
      document.querySelectorAll('[data-close-subscriptions]').forEach((button) => button.addEventListener('click', () => { subscriptionSheetBoard = null; render(); }));
      const overlay = document.querySelector('[data-subscription-overlay]');
      if (overlay) overlay.addEventListener('click', (event) => { if (event.target === overlay) { subscriptionSheetBoard = null; render(); } });
      const subscriptionForm = $('#subscription-form');
      if (subscriptionForm) subscriptionForm.addEventListener('submit', (event) => { event.preventDefault(); const error = addSubscription(selectedBoard, $('#subscription-keyword').value); if (error) $('#subscription-error').textContent = error; else render(); });
      document.querySelectorAll('[data-subscription-toggle]').forEach((button) => button.addEventListener('click', () => { toggleSubscription(button.dataset.subscriptionToggle); render(); }));
      document.querySelectorAll('[data-subscription-remove]').forEach((button) => button.addEventListener('click', () => { removeSubscription(button.dataset.subscriptionRemove); render(); }));
      if (subscriptionSheetBoard === selectedBoard) $('#subscription-keyword')?.focus();
     const search = $('#global-search') || $('#board-search'); if (search) { search.addEventListener('input', (event) => { query = event.target.value; if (route === 'home') route = 'boards'; render(); const next = $('#board-search'); if (next) { next.focus(); next.setSelectionRange(query.length, query.length); } }); }
      document.querySelectorAll('[data-category]').forEach((button) => button.addEventListener('click', () => { category = button.dataset.category; render(); }));
      document.querySelectorAll('[data-sort]').forEach((button) => button.addEventListener('click', () => { sort = button.dataset.sort; render(); }));
      document.querySelectorAll('[data-favorite]').forEach((button) => button.addEventListener('click', (event) => { event.preventDefault(); event.stopPropagation(); toggleFavorite(button.dataset.favorite, button.dataset.label); }));
      document.querySelectorAll('[data-clear-search]').forEach((button) => button.addEventListener('click', () => { query = ''; category = '全部'; render(); }));
      document.querySelectorAll('[data-clear-history]').forEach((button) => button.addEventListener('click', () => showToast('閱讀歷史已清除（prototype 示範）')));
      document.querySelectorAll('[data-clear-favorites]').forEach((button) => button.addEventListener('click', () => { saved.clear(); persistFavorites(); showToast('已清除本機收藏'); render(); }));
      document.querySelectorAll('[data-theme-choice]').forEach((button) => button.addEventListener('click', () => applyTheme(button.dataset.themeChoice)));
      document.querySelectorAll('[data-refresh-hot]').forEach((button) => button.addEventListener('click', () => showToast('即時熱門已重新整理（prototype 示範）')));
    }
    function applyTheme(choice) { const resolved = choice === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : choice; document.documentElement.dataset.theme = resolved; localStorage.setItem('openptt:prototype:theme', choice); $('#theme-toggle').textContent = resolved === 'dark' ? '☀' : '☾'; }
    document.addEventListener('click', (event) => { const routeButton = event.target.closest('[data-route]'); if (routeButton) { event.preventDefault(); go(routeButton.dataset.route); } });
    window.addEventListener('hashchange', () => { route = location.hash.replace('#', '') || 'home'; render(); });
    document.addEventListener('keydown', (event) => { if (event.key === '/' && document.activeElement.tagName !== 'INPUT') { event.preventDefault(); (document.querySelector('#global-search') || document.querySelector('#board-search'))?.focus(); } if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') { event.preventDefault(); (document.querySelector('#global-search') || document.querySelector('#board-search'))?.focus(); } });
    $('#theme-toggle').addEventListener('click', () => { const current = document.documentElement.dataset.theme || 'light'; applyTheme(current === 'dark' ? 'light' : 'dark'); });
    applyTheme(localStorage.getItem('openptt:prototype:theme') || 'system'); render();
  </script>
</body>
</html>
