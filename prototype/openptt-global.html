<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="OpenPTT — a reading-first interface for the public conversation." />
  <title>OpenPTT · The public conversation</title>
  <style>
    :root {
      --canvas: #f5f6f8;
      --surface: #ffffff;
      --surface-soft: #edf0f5;
      --surface-blue: #eef1ff;
      --ink: #17191f;
      --muted: #606675;
      --faint: #89909e;
      --line: #dce0e7;
      --control: #858d9d;
      --brand: #2448e5;
      --brand-deep: #1836b5;
      --brand-soft: #eef1ff;
      --hot: #c6532d;
      --hot-soft: #fff0e9;
      --boo: #a8324e;
      --warning: #825106;
      --warning-soft: #fff7e8;
      --success: #24755b;
      --success-soft: #e9f7f0;
      --shadow-dialog: -24px 0 70px rgba(20, 28, 50, .16);
      --radius-control: 6px;
      --radius-feature: 8px;
    }
    [data-theme="dark"] {
      --canvas: #101216;
      --surface: #181b21;
      --surface-soft: #222630;
      --surface-blue: #242e50;
      --ink: #f2f3f7;
      --muted: #a8afbd;
      --faint: #788293;
      --line: #353a46;
      --control: #788293;
      --brand: #9badff;
      --brand-deep: #b4beff;
      --brand-soft: #242e50;
      --hot: #ffad8e;
      --hot-soft: #3f2924;
      --boo: #ff9cb2;
      --warning: #f3c47a;
      --warning-soft: #3d3021;
      --success: #8de0ba;
      --success-soft: #1f382f;
      --shadow-dialog: -24px 0 70px rgba(0, 0, 0, .38);
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; scroll-behavior: smooth; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font: 14px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", sans-serif; }
    body.dialog-open { overflow: hidden; }
    button, input, select { font: inherit; }
    button { color: inherit; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 58%, white); outline-offset: 3px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .shell { min-height: 100vh; }
    .masthead { position: sticky; top: 0; z-index: 8; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--canvas) 92%, transparent); backdrop-filter: blur(18px); }
    .masthead-inner { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 36px; width: min(1320px, 100%); min-height: 72px; margin: 0 auto; padding: 0 28px; }
    .wordmark { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); }
    .mark { display: inline-grid; place-items: center; width: 31px; height: 31px; border: 2px solid var(--brand); border-radius: 50%; color: var(--brand); font-size: 17px; font-weight: 850; line-height: 1; transform: rotate(-8deg); }
    .wordmark strong { font-size: 16px; font-weight: 900; letter-spacing: -.055em; }
    .wordmark small { display: block; margin-top: -2px; color: var(--faint); font-size: 9px; font-weight: 800; letter-spacing: .13em; }
    .main-nav { display: flex; align-items: center; gap: 22px; }
    .main-nav button { position: relative; padding: 25px 0 22px; border: 0; background: transparent; color: var(--muted); font-size: 12px; font-weight: 800; }
    .main-nav button:hover, .main-nav button.active { color: var(--ink); }
    .main-nav button.active::after { content: ""; position: absolute; right: 0; bottom: -1px; left: 0; height: 3px; background: var(--brand); }
    .mast-actions { display: flex; align-items: center; gap: 8px; }
    .utility { display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 0 11px; border: 1px solid var(--line); border-radius: var(--radius-control); background: var(--surface); color: var(--muted); font-size: 11px; font-weight: 800; }
    .utility:hover { border-color: var(--brand); color: var(--brand); }
    .utility kbd { padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface-soft); color: var(--faint); font-size: 10px; }
    .icon-button { display: inline-grid; place-items: center; width: 38px; height: 38px; border: 1px solid var(--line); border-radius: var(--radius-control); background: var(--surface); color: var(--muted); }
    .icon-button:hover { border-color: var(--brand); color: var(--brand); }
    .mobile-menu { display: none; }
    .page { width: min(1320px, 100%); margin: 0 auto; padding: 62px 28px 96px; }
    .intro { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 56px; align-items: end; padding-bottom: 48px; border-bottom: 1px solid var(--line); }
    .kicker { color: var(--brand); font-size: 10px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { max-width: 760px; margin: 12px 0 16px; color: var(--ink); font-size: clamp(38px, 6vw, 72px); font-weight: 870; letter-spacing: -.075em; line-height: 1.03; }
    .intro-copy p { max-width: 560px; margin-bottom: 0; color: var(--muted); font-size: 16px; line-height: 1.75; }
    .intro-note { padding: 19px 20px; border-left: 3px solid var(--brand); background: var(--surface); }
    .intro-note strong { display: block; margin-bottom: 5px; color: var(--ink); font-size: 13px; }
    .intro-note p { margin-bottom: 0; color: var(--muted); font-size: 12px; }
    .featured-layout { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(270px, .7fr); gap: 32px; margin: 38px 0 54px; }
    .featured { min-height: 328px; display: flex; flex-direction: column; justify-content: space-between; padding: 28px; border-radius: var(--radius-feature); background: var(--ink); color: #fff; }
    [data-theme="dark"] .featured { background: #242e50; }
    .featured .kicker { color: #aebaff; }
    .featured h2 { max-width: 630px; margin: 44px 0 19px; color: #fff; font-size: clamp(27px, 4vw, 45px); letter-spacing: -.065em; line-height: 1.12; }
    .featured p { max-width: 580px; margin-bottom: 22px; color: #c8cedc; font-size: 13px; }
    .featured-footer { display: flex; justify-content: space-between; align-items: center; gap: 14px; color: #afb7c7; font-size: 11px; }
    .featured-open { min-height: 40px; padding: 0 14px; border: 1px solid #5c72e5; border-radius: var(--radius-control); background: var(--brand); color: #fff; font-weight: 850; }
    .featured-open:hover { background: #3759ec; }
    .moving { padding: 0 0 0 28px; border-left: 1px solid var(--line); }
    .section-label { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .section-label h2 { margin-bottom: 0; color: var(--ink); font-size: 15px; letter-spacing: -.02em; }
    .section-label span { color: var(--faint); font-size: 10px; }
    .moving-list { display: grid; }
    .moving-item { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .moving-item:last-child { border-bottom: 0; }
    .moving-index { color: var(--brand); font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .moving-title { padding: 0; border: 0; background: transparent; color: var(--ink); font-size: 13px; font-weight: 800; line-height: 1.45; text-align: left; }
    .moving-title:hover { color: var(--brand); }
    .moving-meta { margin-top: 5px; color: var(--faint); font-size: 10px; }
    .control-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 15px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .search-box { position: relative; flex: 1; max-width: 580px; }
    .search-box::before { content: "⌕"; position: absolute; top: 7px; left: 13px; color: var(--faint); font-size: 21px; }
    .search-box input { width: 100%; height: 42px; padding: 0 46px 0 39px; border: 1px solid var(--control); border-radius: var(--radius-control); background: var(--surface); color: var(--ink); }
    .search-box input::placeholder { color: var(--faint); }
    .search-box kbd { position: absolute; top: 11px; right: 11px; padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface-soft); color: var(--faint); font-size: 10px; }
    .control-actions { display: flex; align-items: center; gap: 8px; }
    .select, .clear-button { height: 38px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--radius-control); background: var(--surface); color: var(--muted); font-size: 11px; font-weight: 750; }
    .clear-button { display: none; }
    .clear-button.visible { display: inline-block; }
    .filter-row { display: flex; gap: 8px; overflow-x: auto; padding: 15px 0 2px; }
    .filter { flex: 0 0 auto; min-height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 99px; background: transparent; color: var(--muted); font-size: 11px; font-weight: 800; }
    .filter:hover, .filter.active { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 38px; margin-top: 34px; }
    .feed-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .feed-head h2 { margin-bottom: 3px; font-size: 22px; letter-spacing: -.045em; }
    .feed-head p { margin-bottom: 0; color: var(--muted); font-size: 11px; }
    .view-toggle { display: flex; gap: 4px; }
    .view-toggle button { padding: 6px 8px; border: 0; background: transparent; color: var(--faint); font-size: 11px; font-weight: 800; }
    .view-toggle button.active { color: var(--brand); }
    .feed { border-top: 2px solid var(--ink); }
    .article { display: grid; grid-template-columns: 48px minmax(0, 1fr) 96px; gap: 17px; align-items: start; padding: 20px 0; border-bottom: 1px solid var(--line); }
    .article:hover { background: color-mix(in srgb, var(--surface-soft) 54%, transparent); }
    .article-number { color: var(--faint); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .article-topline { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-bottom: 7px; color: var(--faint); font-size: 10px; }
    .board { color: var(--brand); font-weight: 900; }
    .tag { display: inline-flex; align-items: center; min-height: 20px; padding: 0 6px; border-radius: 4px; background: var(--hot-soft); color: var(--hot); font-size: 9px; font-weight: 900; }
    .article-title { display: block; padding: 0; border: 0; background: transparent; color: var(--ink); font-size: 18px; font-weight: 850; letter-spacing: -.025em; line-height: 1.45; text-align: left; }
    .article-title:hover { color: var(--brand); }
    .article-snippet { display: -webkit-box; overflow: hidden; max-width: 730px; margin: 7px 0 10px; color: var(--muted); font-size: 12px; line-height: 1.65; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .article-meta { color: var(--faint); font-size: 10px; }
    .article-side { display: grid; justify-items: end; gap: 10px; }
    .signal { display: grid; gap: 3px; justify-items: end; color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
    .signal .push { color: var(--hot); }
    .signal .boo { color: var(--boo); }
    .save, .queue-add { min-width: 34px; min-height: 34px; padding: 0 8px; border: 1px solid var(--line); border-radius: var(--radius-control); background: var(--surface); color: var(--faint); font-size: 13px; }
    .save:hover, .save.saved, .queue-add:hover, .queue-add.queued { border-color: var(--brand); color: var(--brand); }
    .article-actions { display: flex; gap: 5px; }
    .side-block { padding: 20px 0; border-top: 2px solid var(--ink); }
    .side-block + .side-block { margin-top: 24px; border-top-width: 1px; }
    .side-block h2 { margin-bottom: 5px; font-size: 15px; letter-spacing: -.025em; }
    .side-block > p { margin-bottom: 15px; color: var(--muted); font-size: 11px; }
    .library-list { display: grid; }
    .library-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 39px; border-bottom: 1px solid var(--line); }
    .library-item button { padding: 0; border: 0; background: transparent; color: var(--ink); font-size: 11px; font-weight: 800; text-align: left; }
    .library-item button:hover { color: var(--brand); }
    .library-item span { color: var(--faint); font: 10px ui-monospace, monospace; }
    .source-state { padding: 14px; border: 1px solid var(--line); background: var(--surface); }
    .source-state.warning { border-color: #e8ca8e; background: var(--warning-soft); }
    .source-state strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: 11px; }
    .source-state p { margin-bottom: 0; color: var(--muted); font-size: 10px; line-height: 1.65; }
    .source-state button { margin-top: 12px; padding: 0; border: 0; background: transparent; color: var(--brand); font-size: 10px; font-weight: 850; }
    .status-line { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; color: var(--success); font-size: 10px; font-weight: 850; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .empty { padding: 44px 18px; border-bottom: 1px solid var(--line); color: var(--muted); text-align: center; }
    .empty strong { display: block; margin-bottom: 4px; color: var(--ink); }
    .footer { display: flex; justify-content: space-between; gap: 16px; margin-top: 68px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--faint); font-size: 10px; }
    .reader-backdrop { position: fixed; inset: 0; z-index: 20; display: none; justify-content: flex-end; background: rgba(14, 18, 28, .42); }
    .reader-backdrop.open { display: flex; }
    .reader { width: min(760px, 100%); height: 100%; overflow-y: auto; padding: 34px 42px 72px; background: var(--surface); box-shadow: var(--shadow-dialog); }
    .reader-top { display: flex; justify-content: space-between; gap: 20px; padding-bottom: 25px; border-bottom: 1px solid var(--line); }
    .reader h2 { max-width: 630px; margin: 11px 0 14px; color: var(--ink); font-size: clamp(27px, 4vw, 46px); letter-spacing: -.065em; line-height: 1.12; }
    .reader-meta { color: var(--muted); font-size: 11px; }
    .reader-close { flex: 0 0 auto; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: var(--radius-control); background: var(--surface-soft); color: var(--muted); font-size: 20px; }
    .reader-summary { display: flex; flex-wrap: wrap; gap: 18px; margin: 22px 0 28px; padding: 13px 15px; border: 1px solid var(--line); background: var(--surface-soft); color: var(--muted); font: 11px ui-monospace, monospace; }
    .reader-summary .push { color: var(--hot); }
    .reader-body { max-width: 650px; color: var(--ink); font-size: 17px; line-height: 1.95; }
    .reader-body p { margin-bottom: 19px; }
    .reader-body blockquote { margin: 25px 0; padding: 14px 18px; border-left: 3px solid var(--brand); background: var(--surface-blue); color: var(--muted); font-size: 14px; line-height: 1.75; }
    .reader-footer { display: flex; justify-content: space-between; gap: 10px; margin-top: 35px; padding-top: 18px; border-top: 1px solid var(--line); }
    .reader-footer button { min-height: 42px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--radius-control); background: var(--surface); color: var(--ink); font-weight: 800; }
    .reader-footer .primary { border-color: var(--brand); background: var(--brand); color: #fff; }
    .toast { position: fixed; left: 50%; bottom: 27px; z-index: 30; transform: translate(-50%, 14px); padding: 10px 14px; background: var(--ink); color: var(--surface); font-size: 12px; opacity: 0; pointer-events: none; transition: .2s; }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .bottom-nav { display: none; }
    @media (max-width: 1050px) {
      .masthead-inner { gap: 20px; }
      .main-nav { gap: 14px; }
      .intro { grid-template-columns: 1fr 300px; gap: 30px; }
      .workspace { grid-template-columns: 1fr; }
      .side-block { display: inline-block; width: calc(50% - 17px); margin-right: 30px; vertical-align: top; }
      .side-block + .side-block { margin-top: 0; }
      .side-block:last-child { margin-right: 0; }
    }
    @media (max-width: 720px) {
      .masthead-inner { grid-template-columns: auto 1fr auto; min-height: 62px; padding: 0 16px; }
      .mobile-menu { display: inline-grid; place-items: center; width: 37px; height: 37px; border: 1px solid var(--line); border-radius: var(--radius-control); background: var(--surface); color: var(--muted); }
      .main-nav { display: none; }
      .wordmark { justify-self: center; }
      .wordmark small { display: none; }
      .mast-actions { justify-self: end; }
      .utility { display: none; }
      .page { padding: 34px 16px 92px; }
      .intro { display: block; padding-bottom: 30px; }
      h1 { font-size: 46px; }
      .intro-copy p { font-size: 14px; }
      .intro-note { margin-top: 24px; }
      .featured-layout { display: block; margin: 26px 0 38px; }
      .featured { min-height: 300px; padding: 22px; }
      .featured h2 { margin-top: 55px; font-size: 32px; }
      .moving { margin-top: 30px; padding: 0; border-left: 0; }
      .control-row { display: block; }
      .search-box { max-width: none; }
      .control-actions { margin-top: 10px; }
      .select { flex: 1; }
      .workspace { margin-top: 27px; }
      .feed-head { align-items: flex-start; }
      .article { grid-template-columns: 27px minmax(0, 1fr); gap: 9px; padding: 18px 0; }
      .article-title { font-size: 16px; }
      .article-snippet { font-size: 11px; }
      .article-side { grid-column: 2; display: flex; align-items: center; justify-content: space-between; width: 100%; }
      .signal { display: flex; gap: 9px; }
      .side-block { display: block; width: 100%; margin: 0; }
      .side-block + .side-block { margin-top: 29px; }
      .footer { display: block; line-height: 1.8; }
      .footer span { display: block; }
      .reader { padding: 24px 18px 54px; }
      .reader-body { font-size: 16px; }
      .bottom-nav { position: fixed; right: 0; bottom: 0; left: 0; z-index: 9; display: grid; grid-template-columns: repeat(5, 1fr); padding: 7px 6px max(7px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 95%, transparent); backdrop-filter: blur(16px); }
      .bottom-nav button { display: grid; gap: 2px; place-items: center; padding: 4px; border: 0; background: transparent; color: var(--faint); font-size: 9px; font-weight: 800; }
      .bottom-nav button span { font-size: 17px; }
      .bottom-nav button.active { color: var(--brand); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="masthead-inner">
        <button class="mobile-menu" aria-label="開啟選單">☰</button>
        <a class="wordmark" href="#home" aria-label="OpenPTT 首頁"><span class="mark">)(</span><span><strong>OpenPTT</strong><small>THE PUBLIC CONVERSATION</small></span></a>
        <nav class="main-nav" aria-label="主導覽">
          <button class="active" data-view="home">Reading desk</button><button data-view="boards">Boards</button><button data-view="hot">Trending</button><button data-view="favorites">Library</button>
        </nav>
        <div class="mast-actions"><button class="utility" id="focus-search">⌕ <span>Search</span> <kbd>/</kbd></button><button class="icon-button" id="theme" aria-label="切換主題">☾</button></div>
      </div>
    </header>

    <main class="page" id="page" aria-live="polite"></main>
    <footer class="footer"><span>OpenPTT · reading-first, guest-first.</span><span>示範資料 · 快照 2026-09-24 09:00 +08:00 · 不代表即時排名</span></footer>
  </div>
  <nav class="bottom-nav" aria-label="主要導覽"><button class="active" data-view="home"><span>⌂</span>閱讀桌</button><button data-view="boards"><span>▤</span>看板</button><button data-view="hot"><span>↗</span>熱門</button><button data-view="favorites"><span>☆</span>收藏</button><button data-view="queue"><span>▱</span>佇列</button></nav>
  <div class="reader-backdrop" id="reader-backdrop"><article class="reader" role="dialog" aria-modal="true" aria-labelledby="reader-title"><div id="reader-content"></div></article></div>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const articleData = [
      { id: 'g1', board: 'Tech_Job', type: '心得', title: '今年轉職後，終於找到比較像生活的工作', excerpt: '把面試、薪資與團隊文化整理成一篇，給正在猶豫的人參考。', author: 'softly', time: '18 分鐘前', push: 82, boo: 3, arrow: 17, hot: true },
      { id: 'g2', board: 'Stock', type: '新聞', title: '台股早盤震盪，電子權值股輪動加快', excerpt: '盤面焦點落在半導體與金融，成交量較昨日同期放大。', author: 'marketwatch', time: '32 分鐘前', push: 54, boo: 8, arrow: 26, hot: true },
      { id: 'g3', board: 'Lifeismoney', type: '情報', title: '這週末超商咖啡第二杯優惠整理', excerpt: '整理各家門市與限時活動，出門前可以先存起來。', author: 'save_more', time: '1 小時前', push: 41, boo: 1, arrow: 12, hot: false },
      { id: 'g4', board: 'NBA', type: '討論', title: '季後賽防守策略，這個調度真的看不懂', excerpt: '從第四節的輪轉開始，整場節奏和前幾場很不一樣。', author: 'boxscore', time: '2 小時前', push: 38, boo: 4, arrow: 21, hot: false },
      { id: 'g5', board: 'Gossiping', type: '問卦', title: '大家最近下班後都在做什麼？', excerpt: '想找一些不需要花很多錢、又可以真的放鬆的活動。', author: 'afterwork', time: '3 小時前', push: 27, boo: 12, arrow: 9, hot: false },
      { id: 'g6', board: 'Japan_Travel', type: '問題', title: '第一次帶長輩去關西，交通怎麼安排比較順？', excerpt: '希望一天不要排太多點，想把移動的疲勞降到最低。', author: 'slowtraveler', time: '4 小時前', push: 24, boo: 0, arrow: 8, hot: false }
    ];
    const boardData = [
      ['Tech_Job', '科技職涯與面試經驗', '12.4k'], ['Stock', '投資理財與市場觀察', '18.8k'], ['Lifeismoney', '省錢情報與消費分享', '9.6k'], ['NBA', '籃球賽事與球員討論', '7.2k'], ['Gossiping', '綜合生活與時事討論', '24.1k'], ['Japan_Travel', '日本旅遊規劃與經驗', '6.8k']
    ];
    const state = { view: 'home', query: '', board: '全部看板', sort: 'for-you', saved: new Set(['g1']), queued: new Set(['g1', 'g4']), theme: localStorage.getItem('openptt:global:theme') || 'light' };
    const $ = (selector) => document.querySelector(selector);
    const esc = (value) => String(value).replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
    const getArticle = (id) => articleData.find((article) => article.id === id);
    const visibleArticles = () => articleData.filter((article) => {
      const haystack = `${article.board} ${article.type} ${article.title} ${article.excerpt} ${article.author}`.toLocaleLowerCase();
      return (!state.query || haystack.includes(state.query.toLocaleLowerCase())) && (state.board === '全部看板' || article.board === state.board);
    });
    function articleRow(article, index) {
      const saved = state.saved.has(article.id); const queued = state.queued.has(article.id);
      return `<article class="article"><div class="article-number">${String(index + 1).padStart(2, '0')}</div><div><div class="article-topline"><span class="board">${esc(article.board)}</span><span>·</span><span>${esc(article.type)}</span><span>·</span><span>${esc(article.time)}</span>${article.hot ? '<span class="tag">熱</span>' : ''}</div><button class="article-title" data-article="${article.id}">${esc(article.title)}</button><p class="article-snippet">${esc(article.excerpt)}</p><div class="article-meta">${esc(article.author)}　·　閱讀全文 →</div></div><div class="article-side"><div class="signal"><span><span class="push">推 ${article.push}</span>　<span class="boo">噓 ${article.boo}</span></span><span>↔ ${article.arrow}</span></div><div class="article-actions"><button class="save ${saved ? 'saved' : ''}" data-save="${article.id}" aria-label="${saved ? '取消收藏' : '收藏文章'}">${saved ? '★' : '☆'}</button><button class="queue-add ${queued ? 'queued' : ''}" data-queue="${article.id}" aria-label="${queued ? '移出閱讀佇列' : '加入閱讀佇列'}">${queued ? '✓' : '+'}</button></div></div></article>`;
    }
    function renderHome() {
      const articles = visibleArticles();
      const moving = articleData.slice(1, 4).map((article, index) => `<div class="moving-item"><span class="moving-index">0${index + 1}</span><div><button class="moving-title" data-article="${article.id}">${esc(article.title)}</button><div class="moving-meta">${esc(article.board)} · 推 ${article.push} · ${esc(article.time)}</div></div></div>`).join('');
      return `<section class="intro"><div class="intro-copy"><div class="kicker">OpenPTT / Reading desk</div><h1>The public conversation,<br><span style="color:var(--brand)">at your pace.</span></h1><p>保留 PTT 的文字密度與多種觀點，讓搜尋、掃讀、深入閱讀與回訪，變成一條清楚的閱讀路徑。</p></div><aside class="intro-note"><strong>今日閱讀狀態</strong><p>訪客模式 · 3 篇收藏 · 上次閱讀在 Tech_Job。所有偏好只儲存在這個瀏覽器。</p></aside></section><section class="featured-layout"><article class="featured"><div><div class="kicker">Editor's pick / 示範選讀</div><h2>${esc(articleData[0].title)}</h2><p>${esc(articleData[0].excerpt)} 這是一篇固定示範內容，正式版會顯示來源與最後同步時間。</p></div><div class="featured-footer"><span>${esc(articleData[0].board)} · ${esc(articleData[0].author)} · ${esc(articleData[0].time)}</span><button class="featured-open" data-article="g1">開始閱讀 →</button></div></article><aside class="moving"><div class="section-label"><h2>What’s moving</h2><span>依推數排序</span></div><div class="moving-list">${moving}</div></aside></section>${renderControls()}<section class="workspace"><div><div class="feed-head"><div><h2>${state.query || state.board !== '全部看板' ? '搜尋結果' : 'Latest signals'}</h2><p>${articles.length} 篇示範文章 · 以閱讀訊號輔助判斷</p></div><div class="view-toggle"><button class="${state.sort === 'for-you' ? 'active' : ''}" data-sort="for-you">為你整理</button><button class="${state.sort === 'latest' ? 'active' : ''}" data-sort="latest">最新</button><button class="${state.sort === 'hot' ? 'active' : ''}" data-sort="hot">最熱</button></div></div><div class="feed">${articles.length ? articles.map(articleRow).join('') : '<div class="empty"><strong>沒有符合的文章</strong>換一個關鍵字或清除目前的看板篩選。</div>'}</div></div>${renderSide()}</section>`;
    }
    function renderControls() { return `<section class="controls"><div class="control-row"><label class="search-box"><span class="sr-only">搜尋看板、文章或作者</span><input id="local-search" type="search" value="${esc(state.query)}" placeholder="搜尋看板、文章或作者"/><kbd>/</kbd></label><div class="control-actions"><select class="select" id="board-select" aria-label="依看板篩選"><option>全部看板</option>${boardData.map(([name]) => `<option ${state.board === name ? 'selected' : ''}>${name}</option>`).join('')}</select><button class="clear-button ${state.query || state.board !== '全部看板' ? 'visible' : ''}" id="clear">清除</button></div></div><div class="filter-row"><button class="filter ${state.board === '全部看板' ? 'active' : ''}" data-board="全部看板">全部看板</button>${boardData.slice(0, 5).map(([name]) => `<button class="filter ${state.board === name ? 'active' : ''}" data-board="${name}">${name}</button>`).join('')}</div></section>`; }
    function renderSide() { const boardRows = boardData.slice(0, 4).map(([name, desc, count]) => `<div class="library-item"><button data-board="${name}">${name}</button><span>${count}</span></div>`).join(''); const queued = [...state.queued].map((id) => getArticle(id)).filter(Boolean).slice(0, 3).map((article) => `<div class="library-item"><button data-article="${article.id}">${esc(article.title)}</button><span>${esc(article.board)}</span></div>`).join(''); return `<aside><section class="side-block"><h2>Your boards</h2><p>最近閱讀與固定追蹤的入口</p><div class="library-list">${boardRows}</div><button class="text-link" data-view="boards" style="margin-top:13px;padding:0;border:0;background:transparent;color:var(--brand);font-size:10px;font-weight:850">探索全部看板 →</button></section><section class="side-block"><h2>Reading queue</h2><p>先存下來，等有時間再讀</p><div class="library-list">${queued || '<div class="empty" style="padding:18px 0;border-bottom:0">佇列是空的</div>'}</div><button class="text-link" data-view="queue" style="margin-top:13px;padding:0;border:0;background:transparent;color:var(--brand);font-size:10px;font-weight:850">管理佇列 →</button></section><section class="side-block"><div class="source-state warning"><div class="status-line" style="color:var(--warning)"><span class="status-dot"></span>示範資料</div><strong>來源邊界透明</strong><p>固定快照 2026-09-24 09:00 +08:00。正式 adapter 會顯示來源與 stale 狀態，不把示範資料稱為即時。</p><button id="source-info">查看資料狀態 →</button></div></section></aside>`; }
    function renderBoards() { const rows = boardData.filter(([name, desc]) => !state.query || `${name} ${desc}`.toLocaleLowerCase().includes(state.query.toLocaleLowerCase())).map(([name, desc, count], index) => `<article class="article"><div class="article-number">${String(index + 1).padStart(2, '0')}</div><div><div class="article-topline"><span class="board">${name}</span><span>·</span><span>看板</span></div><button class="article-title" data-board="${name}">${desc}</button><p class="article-snippet">${count} 人關注 · 先看板名與描述，再決定要不要加入收藏。</p><div class="article-meta">開啟看板 →</div></div><div class="article-side"><button class="save ${state.saved.has(`board:${name}`) ? 'saved' : ''}" data-board-save="${name}" aria-label="收藏 ${name}">${state.saved.has(`board:${name}`) ? '★' : '☆'}</button></div></article>`).join(''); return `<section class="intro"><div class="intro-copy"><div class="kicker">Board explorer</div><h1>Find your<br><span style="color:var(--brand)">next board.</span></h1><p>用板名或描述探索 33 個看板。OpenPTT 先把上下文說清楚，再把你送進文章。</p></div><aside class="intro-note"><strong>國際化不等於把中文藏起來</strong><p>品牌與導覽採英文識別，內容保留台灣 PTT 使用者熟悉的中文語彙。</p></aside></section>${renderControls()}<section class="workspace"><div><div class="feed-head"><div><h2>Board directory</h2><p>${rows ? boardData.length : 0} 個示範看板 · 搜尋即時更新</p></div></div><div class="feed">${rows || '<div class="empty"><strong>找不到相關看板</strong>試試輸入英文板名或中文描述。</div>'}</div></div>${renderSide()}</section>`; }
    function renderHot() { const hot = articleData.slice().sort((a, b) => b.push - a.push); return `<section class="intro"><div class="intro-copy"><div class="kicker">Trending signals</div><h1>What people<br><span style="color:var(--brand)">are reading.</span></h1><p>熱門是發現入口，不是推薦真理。OpenPTT 把推噓摘要與來源時間放在同一個掃讀單位。</p></div><aside class="intro-note"><strong>排序規則</strong><p>本候選以固定示範資料的推數排序；正式版會明示時間與資料來源。</p></aside></section><section class="workspace"><div><div class="feed-head"><div><h2>Trending now</h2><p>${hot.length} 篇示範文章</p></div></div><div class="feed">${hot.map(articleRow).join('')}</div></div>${renderSide()}</section>`; }
    function renderFavorites() { const savedArticles = articleData.filter((article) => state.saved.has(article.id)); return `<section class="intro"><div class="intro-copy"><div class="kicker">Your library</div><h1>Keep the<br><span style="color:var(--brand)">good ones.</span></h1><p>收藏看板與文章，不需要登入，也不把個人閱讀紀錄送到伺服器。</p></div><aside class="intro-note"><strong>本機資料</strong><p>目前有 ${savedArticles.length} 篇文章收藏。重新整理後仍保留；清除瀏覽器資料後會消失。</p></aside></section><section class="workspace"><div><div class="feed-head"><div><h2>Saved articles</h2><p>${savedArticles.length} 篇文章</p></div></div><div class="feed">${savedArticles.length ? savedArticles.map(articleRow).join('') : '<div class="empty"><strong>還沒有收藏</strong>在文章右側按下 ☆，把想回來看的內容留在這裡。</div>'}</div></div>${renderSide()}</section>`; }
    function renderQueue() { const items = [...state.queued].map((id) => getArticle(id)).filter(Boolean); return `<section class="intro"><div class="intro-copy"><div class="kicker">Reading queue</div><h1>Read it<br><span style="color:var(--brand)">when ready.</span></h1><p>把文章從「現在要不要讀」的壓力裡拿出來，留給之後的自己。</p></div><aside class="intro-note"><strong>佇列狀態</strong><p>${items.length} 篇內容只存在這個瀏覽器。可以在文章列加入或移除。</p></aside></section><section class="workspace"><div><div class="feed-head"><div><h2>Later</h2><p>${items.length} 篇文章</p></div></div><div class="feed">${items.length ? items.map(articleRow).join('') : '<div class="empty"><strong>閱讀佇列是空的</strong>看到想讀但現在沒時間的內容，按下 +。</div>'}</div></div>${renderSide()}</section>`; }
    function render() { const content = state.view === 'home' ? renderHome() : state.view === 'boards' ? renderBoards() : state.view === 'hot' ? renderHot() : state.view === 'favorites' ? renderFavorites() : renderQueue(); $('#page').innerHTML = content; document.querySelectorAll('[data-view]').forEach((button) => button.classList.toggle('active', button.dataset.view === state.view)); bind(); }
    function bind() { document.querySelectorAll('[data-view]').forEach((button) => button.addEventListener('click', () => { state.view = button.dataset.view; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); })); document.querySelectorAll('[data-article]').forEach((button) => button.addEventListener('click', () => openReader(button.dataset.article))); document.querySelectorAll('[data-board]').forEach((button) => button.addEventListener('click', () => { state.board = button.dataset.board; state.view = 'home'; render(); })); document.querySelectorAll('[data-sort]').forEach((button) => button.addEventListener('click', () => { state.sort = button.dataset.sort; showToast(`已切換為${button.textContent}`); render(); })); document.querySelectorAll('[data-save]').forEach((button) => button.addEventListener('click', (event) => { event.stopPropagation(); const id = button.dataset.save; state.saved.has(id) ? state.saved.delete(id) : state.saved.add(id); showToast(state.saved.has(id) ? '已加入收藏' : '已取消收藏'); render(); })); document.querySelectorAll('[data-queue]').forEach((button) => button.addEventListener('click', (event) => { event.stopPropagation(); const id = button.dataset.queue; state.queued.has(id) ? state.queued.delete(id) : state.queued.add(id); showToast(state.queued.has(id) ? '已加入閱讀佇列' : '已移出閱讀佇列'); render(); })); document.querySelectorAll('[data-board-save]').forEach((button) => button.addEventListener('click', () => { const id = `board:${button.dataset.boardSave}`; state.saved.has(id) ? state.saved.delete(id) : state.saved.add(id); showToast(state.saved.has(id) ? '已收藏看板' : '已取消收藏'); render(); })); const localSearch = $('#local-search'); if (localSearch) localSearch.addEventListener('input', (event) => { state.query = event.target.value.trim(); render(); $('#local-search').focus(); $('#local-search').setSelectionRange(state.query.length, state.query.length); }); const boardSelect = $('#board-select'); if (boardSelect) boardSelect.addEventListener('change', (event) => { state.board = event.target.value; render(); }); const clear = $('#clear'); if (clear) clear.addEventListener('click', () => { state.query = ''; state.board = '全部看板'; render(); }); const sourceInfo = $('#source-info'); if (sourceInfo) sourceInfo.addEventListener('click', () => showToast('示範資料：固定快照，不代表即時排名')); }
    function openReader(id) { const article = getArticle(id); if (!article) return; $('#reader-content').innerHTML = `<div class="reader-top"><div><div class="kicker">${esc(article.board)} / Reader</div><h2 id="reader-title">${esc(article.title)}</h2><div class="reader-meta">${esc(article.author)} · ${esc(article.time)} · 來源：PTT 公開文章</div></div><button class="reader-close" id="reader-close" aria-label="關閉文章">×</button></div><div class="reader-summary"><span class="push">推 ${article.push}</span><span style="color:var(--boo)">噓 ${article.boo}</span><span>↔ ${article.arrow}</span><span>示範資料</span></div><div class="reader-body"><p>${esc(article.excerpt)} 這是獨立 HTML prototype 的閱讀示意，正式版將由 server-side adapter 取得文章全文。</p><blockquote>OpenPTT 的主流程是閱讀。推噓與熱門訊號提供判斷線索，但不把使用者的互動操作混進來。</blockquote><p>閱讀畫面保留看板上下文、作者與發布時間，讓你知道自己正在看哪裡。文章內容使用舒適的行距與寬度，關閉後可以回到原本的 feed 位置。</p><p>當來源過期或受限時，正式介面會清楚顯示「資料可能已過期」，並保留可閱讀內容與重新整理入口，不用假裝成即時資料。</p></div><div class="reader-footer"><button id="reader-back">回到列表</button><button class="primary" id="reader-save">${state.saved.has(article.id) ? '★ 已收藏' : '☆ 收藏文章'}</button></div>`; $('#reader-backdrop').classList.add('open'); document.body.classList.add('dialog-open'); $('#reader-close').focus(); $('#reader-save').addEventListener('click', () => { state.saved.has(article.id) ? state.saved.delete(article.id) : state.saved.add(article.id); $('#reader-save').textContent = state.saved.has(article.id) ? '★ 已收藏' : '☆ 收藏文章'; showToast(state.saved.has(article.id) ? '已加入收藏' : '已取消收藏'); }); $('#reader-close').addEventListener('click', closeReader); $('#reader-back').addEventListener('click', closeReader); }
    function closeReader() { $('#reader-backdrop').classList.remove('open'); document.body.classList.remove('dialog-open'); }
    function showToast(message) { const toast = $('#toast'); toast.textContent = message; toast.classList.add('show'); clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200); }
    function applyTheme(theme) { state.theme = theme; document.documentElement.dataset.theme = theme; localStorage.setItem('openptt:global:theme', theme); $('#theme').textContent = theme === 'dark' ? '☀' : '☾'; }
    $('#theme').addEventListener('click', () => applyTheme(state.theme === 'dark' ? 'light' : 'dark'));
    $('#focus-search').addEventListener('click', () => { const input = $('#local-search'); if (input) { input.focus(); input.scrollIntoView({ block: 'center' }); } });
    $('#reader-backdrop').addEventListener('click', (event) => { if (event.target.id === 'reader-backdrop') closeReader(); });
    document.addEventListener('keydown', (event) => { if (event.key === '/' && document.activeElement?.tagName !== 'INPUT') { event.preventDefault(); $('#local-search')?.focus(); } if (event.key === 'Escape') closeReader(); });
    applyTheme(state.theme); render();
  </script>
</body>
</html>
